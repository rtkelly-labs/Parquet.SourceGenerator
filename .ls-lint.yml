# .ls-lint.yml
# Estate-wide ban on shell (.sh, .bash, .zsh) and PowerShell (.ps1, .psm1) scripts.
# Exceptions must be explicitly listed in the  section below.

ls:
  .sh: exists:0
  .bash: exists:0
  .zsh: exists:0
  .ps1: exists:0
  .psm1: exists:0
  "**":
    .sh: exists:0
    .bash: exists:0
    .zsh: exists:0
    .ps1: exists:0
    .psm1: exists:0
  scripts:
    .dir: regex:.*
    .md: regex:.*
    .json: regex:.*
    .yml: regex:.*
    .yaml: regex:.*
    .toml: regex:.*
    .xml: regex:.*
    .sql: regex:.*
    .txt: regex:.*
    .props: regex:.*
    .razor: regex:.*
    .css: regex:.*
    .js: regex:.*
    .cs: regex:.*
    .fsx: regex:.*
    .py: exists:0
    .*: exists:0
  "scripts/**":
    .dir: regex:.*
    .md: regex:.*
    .json: regex:.*
    .yml: regex:.*
    .yaml: regex:.*
    .toml: regex:.*
    .xml: regex:.*
    .sql: regex:.*
    .txt: regex:.*
    .props: regex:.*
    .razor: regex:.*
    .css: regex:.*
    .js: regex:.*
    .cs: regex:.*
    .fsx: regex:.*
    .py: exists:0
    .*: exists:0

ignore:
  - .git
  - .venv
  - "**/.venv"
  - node_modules
  - "**/node_modules"
  - temp
  - .temp
  - "**/temp"
  - .worktrees
  - bin
  - obj
  - "**/bin"
  - "**/obj"
  - dist
  - build
  - artifacts
  - benchmarks
  - "**/benchmarks"
  # Explicit repository exceptions:
  - scripts/generate_test_data.py
