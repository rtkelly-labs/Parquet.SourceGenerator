      <rect fill="url(#mark-grad)" height="14.0" rx="7.0" ry="7.0" width="244.0" x="128.0" y="364.0"/>
    </g>
    <g fill="none" stroke="#1d222d" stroke-linecap="round" stroke-linejoin="round" stroke-width="19.0">
      <polyline points="158.67,364.0 158.67,146.0"/>
      <polyline points="158.67,328.67 250.0,237.33 250.0,146.0"/>
      <polyline points="250.0,237.33 341.33,146.0"/>
