      <circle cx="340.0" cy="146.0" fill="#1d222d" r="14.0" stroke="none"/>
    </g>
    <g fill="none" stroke="url(#mark-grad)" stroke-linecap="round" stroke-linejoin="round" stroke-width="5.0">
      <polyline points="160.0,364.0 160.0,146.0"/>
      <polyline points="160.0,326.0 250.0,236.0 250.0,146.0"/>
      <polyline points="250.0,236.0 340.0,146.0"/>
