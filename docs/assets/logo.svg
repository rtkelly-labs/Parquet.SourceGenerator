      <circle cx="160.0" cy="146.0" fill="url(#mark-grad)" r="9.0" stroke="none"/>
      <circle cx="160.0" cy="326.0" fill="url(#mark-grad)" r="7.5" stroke="none"/>
      <circle cx="250.0" cy="146.0" fill="url(#mark-grad)" r="9.0" stroke="none"/>
