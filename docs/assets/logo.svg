<?xml version="1.0" encoding="utf-8" ?>
<svg xmlns="http://www.w3.org/2000/svg" aria-label="Parquet.SourceGenerator" role="img" version="1.1" viewBox="0 0 500 500">
  <title>Parquet.SourceGenerator</title>
  <desc>Five interlocking columns in a cyan-to-violet gradient, their joints staggered like a parquet bond, with an emitter dot above the centre column.</desc>
  <defs>
    <linearGradient id="wood-face-0" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#f2ddc0"/>
      <stop offset="100%" stop-color="#e3c39a"/>
    </linearGradient>
    <linearGradient id="wood-face-1" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#dfb98c"/>
      <stop offset="100%" stop-color="#c99f6c"/>
    </linearGradient>
    <linearGradient id="wood-face-2" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#c49a68"/>
      <stop offset="100%" stop-color="#a87f4c"/>
    </linearGradient>
    <linearGradient gradientUnits="userSpaceOnUse" id="circuit-global-grad" x1="0" x2="500" y1="0" y2="500">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="45%" stop-color="#00c4e8"/>
      <stop offset="56%" stop-color="#6d28d9"/>
      <stop offset="78%" stop-color="#7209b7"/>
      <stop offset="100%" stop-color="#b5179e"/>
    </linearGradient>
    <linearGradient gradientUnits="userSpaceOnUse" id="mark-grad" x1="0" x2="500" y1="0" y2="500">
      <stop offset="0%" stop-color="#22e6f7"/>
      <stop offset="45%" stop-color="#3ec8ec"/>
      <stop offset="60%" stop-color="#8b6cf0"/>
      <stop offset="100%" stop-color="#c46ce0"/>
    </linearGradient>
    <filter height="160%" id="glow-circuit" width="160%" x="-30%" y="-30%">
      <feGaussianBlur in="SourceGraphic" result="wide" stdDeviation="7"/>
      <feGaussianBlur in="SourceGraphic" result="tight" stdDeviation="2"/>
      <feMerge>
        <feMergeNode in="wide"/>
        <feMergeNode in="tight"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect fill="#1d222d" height="436.0" rx="62" stroke="#2b3140" stroke-width="3" width="436.0" x="32.0" y="32.0"/>
  <g filter="url(#glow-circuit)">
    <g>
      <rect fill="url(#mark-grad)" fill-opacity="0.9" height="56.0" rx="7.0" ry="7.0" width="64.0" x="128.0" y="120.0"/>
