      <rect fill="url(#mark-grad)" fill-opacity="0.9" height="56.0" rx="7.0" ry="7.0" width="64.0" x="128.0" y="260.0"/>
      <rect fill="url(#mark-grad)" fill-opacity="0.9" height="22.0" rx="7.0" ry="7.0" width="64.0" x="128.0" y="330.0"/>
      <rect fill="url(#mark-grad)" fill-opacity="0.9" height="21.0" rx="7.0" ry="7.0" width="64.0" x="218.0" y="120.0"/>
      <rect fill="url(#mark-grad)" fill-opacity="0.9" height="56.0" rx="7.0" ry="7.0" width="64.0" x="218.0" y="155.0"/>
      <rect fill="url(#mark-grad)" fill-opacity="0.9" height="56.0" rx="7.0" ry="7.0" width="64.0" x="218.0" y="225.0"/>
      <rect fill="url(#mark-grad)" fill-opacity="0.9" height="56.0" rx="7.0" ry="7.0" width="64.0" x="218.0" y="295.0"/>
      <rect fill="url(#mark-grad)" fill-opacity="0.9" height="56.0" rx="7.0" ry="7.0" width="64.0" x="308.0" y="120.0"/>
      <rect fill="url(#mark-grad)" fill-opacity="0.9" height="56.0" rx="7.0" ry="7.0" width="64.0" x="308.0" y="190.0"/>
      <rect fill="url(#mark-grad)" fill-opacity="0.9" height="56.0" rx="7.0" ry="7.0" width="64.0" x="308.0" y="260.0"/>
      <rect fill="url(#mark-grad)" fill-opacity="0.9" height="22.0" rx="7.0" ry="7.0" width="64.0" x="308.0" y="330.0"/>
      <rect fill="url(#mark-grad)" height="14.0" rx="7.0" ry="7.0" width="244.0" x="128.0" y="364.0"/>
    </g>
    <g fill="none" stroke="#1d222d" stroke-linecap="round" stroke-linejoin="round" stroke-width="15.0">
