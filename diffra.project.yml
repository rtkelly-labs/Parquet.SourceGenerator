# Diffra project file for this repository (https://github.com/rtkelly-labs/Diffra).
# Shadow only: nothing reads it to decide a build. The shadow steps in CI emit payloads in the
# shapes it declares, and docs/internals/diffra-shadow-payloads.md records where they do not fit.
schema: https://diffra.dev/schemas/project-v1.schema.json
scope: parquet-sourcegenerator

dimensions:
  # One test run per suite: the core tests, the ABI matrix and the external-interop tests.
  suite: { values: [core, abi, external] }
  os: { observed: true }
  arch: { observed: true }
  # Benchmarks only: the runtime major.minor and the runner's processor model.
  runtime: { observed: true }
  cpu: { observed: true }

metrics:
  tests:
    type: diffra/test-results@1
    from:
      trx: "test/*/TestResults/ci-*.trx"
    required: true
    fields:
      results:
        stratify: [suite, os, arch]
        check:
          fail: { tag: [error] }
        versus:
          fail: { transition: [{ from: success, to: error }] }
          needs-review: { transition: [{ from: success, to: skipped }] }
        keys: { added: pass, removed: needs-review }

  # The regression gate's benchmarks (docs/reference/benchmarks.md, "Diffra evidence"). The
  # budgets are the ones measured from the gate's own run-to-run variance.
  benchmarks:
    type: diffra/benchmark@1
    from:
      benchmarkdotnet: "BenchmarkDotNet.Artifacts/gate/results/*-report-full-compressed.json"
    required: true
    fields:
      allocatedBytes:
        # Allocations held within 152 B across AMD and Intel runners, so cpu is not a stratum.
        stratify: [os, arch, runtime]
        versus:
          warn: { increase: { above: 256B } }
          fail: { increase: { above: 1024B } }
        keys: { added: pass, removed: fail }
      gen0PerKOps:
        # The runtime sizes gen0 from the CPU cache: counts differ 2 to 5 times across models.
        stratify: [os, arch, runtime, cpu]
        versus:
          warn: { increase: { above: 35%, and: { above: 20 } } }
          fail: { increase: { above: 50%, and: { above: 30 } } }
      gen1PerKOps:
        stratify: [os, arch, runtime, cpu]
        versus:
          warn: { increase: { above: 35%, and: { above: 20 } } }
          fail: { increase: { above: 50%, and: { above: 30 } } }
      gen2PerKOps:
        stratify: [os, arch, runtime, cpu]
        versus:
          warn: { increase: { above: 35%, and: { above: 20 } } }
          fail: { increase: { above: 50%, and: { above: 30 } } }
      meanTime:
        # A trend to watch, never a failure: the same code ran about 10% apart on one model.
        stratify: [os, arch, runtime, cpu]
        versus:
          warn: { increase: { above: 25% } }

limits:
  # The core suite alone has about 2400 tests.
  maxKeys: 5000
