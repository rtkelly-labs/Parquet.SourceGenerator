name: Broad Property-Based Fuzz Run

# The per-push CI job already runs the property suite on its fixed default seed set, which is what
# keeps that signal deterministic. This workflow is the other half: a scheduled and manually
# dispatchable job that walks seeds CI has never tried. New bugs come from here; the per-push gate
# stays reproducible.
on:
  schedule:
    # Every Monday at 03:00 UTC, offset from the benchmark job so the two never contend.
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      seed:
        description: 'Base seed (blank uses a fresh seed derived from the run number)'
        required: false
        default: ''
      cases:
        description: 'Cases per property'
        required: false
        default: '250'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fuzz:
    name: broad-fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Resolve Seed
        id: seed
        env:
          INPUT_SEED: ${{ github.event.inputs.seed }}
          INPUT_CASES: ${{ github.event.inputs.cases }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          seed="$INPUT_SEED"
          if [ -z "$seed" ]; then
            # Derived from the run number rather than $RANDOM so that the run's own logs are enough
            # to replay it, and re-running the same workflow run reproduces the same seed.
            seed=$(( 1690000001 + RUN_NUMBER * 7919 ))
          fi
          cases="${INPUT_CASES:-250}"
          echo "seed=$seed" >> "$GITHUB_OUTPUT"
          echo "cases=$cases" >> "$GITHUB_OUTPUT"
          echo "::notice::Fuzzing with PARQUET_FUZZ_SEED=$seed PARQUET_FUZZ_CASES=$cases"

      - name: Restore
        run: dotnet restore Parquet.SourceGenerator.slnx

      # DefaultSeedsAreDeterministicAndStable guards the per-push CI contract: with NO override the
      # suite runs one fixed seed set. This job overrides both variables by design, so that test
      # fails here by construction; it failed every weekly run and hid whether any real fuzz case
      # did. It still runs, unchanged, in ci.yml on every push.
      - name: Run Property-Based Suite On Broad Seeds
        env:
          PARQUET_FUZZ_SEED: ${{ steps.seed.outputs.seed }}
          PARQUET_FUZZ_CASES: ${{ steps.seed.outputs.cases }}
        run: |
          dotnet test test/Parquet.SourceGenerator.Tests/Parquet.SourceGenerator.Tests.csproj \
            --configuration Release \
            --filter "FullyQualifiedName~PropertyBased&FullyQualifiedName!~DefaultSeedsAreDeterministicAndStable" \
            --logger "trx;LogFileName=fuzz.trx"

      - name: Upload Minimised Failing Cases
        # Every failure writes a minimised, replayable fixture; publishing them is what turns a red
        # scheduled run into a pull request someone can open with a one-line copy.
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fuzz-failures-${{ steps.seed.outputs.seed }}
          path: temp/fuzz-failures/
          if-no-files-found: warn

  # A scheduled gate that only turns red is muted by its own history (#564: this workflow failed
  # unseen for weeks). When the job above fails, open one `area:ci` issue, or comment on the open
  # one. It is a separate job so the only job that runs repo code never holds `issues: write`,
  # and it needs no checkout. Same pattern as metrics-oracle.yml.
  notify-failure:
    name: Report scheduled failure
    needs: fuzz
    if: ${{ always() && needs.fuzz.result == 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update the failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="[CI] scheduled fuzz failed"
          body="The scheduled fuzz workflow failed: [run]($RUN_URL). Open the run for the failing step. This issue is updated with a comment on each further failure; close it once the workflow is green again."
          gh label create "area:ci" --color B60205 --description "CI and workflow gates" >/dev/null 2>&1 || true
          existing=$(gh issue list --state open --label "area:ci" --search "\"$title\" in:title" \
            --json number,title --jq "[.[] | select(.title == \"$title\")][0].number // empty")
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Failed again: [run]($RUN_URL)."
          else
            gh issue create --title "$title" --body "$body" --label "area:ci"
          fi
