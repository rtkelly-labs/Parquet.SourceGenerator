name: Performance Benchmarks & Baseline Verification

on:
  schedule:
    # Run comprehensive deep benchmark every Sunday at 02:00 UTC
    - cron: '0 2 * * 0'
  workflow_dispatch:
    inputs:
      job_preset:
        description: 'BenchmarkDotNet Job Preset'
        required: false
        default: 'short'
        type: choice
        options:
          - short
          - default
      scale:
        description: 'Scale (Row Counts)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - 1m
          - 100k
          - quick
      filter:
        description: 'BenchmarkDotNet filter pattern'
        required: false
        default: '*'
      target_branch:
        description: 'Branch to benchmark and commit updates to (defaults to current)'
        required: false
        default: ''
      gate_only:
        description: 'Run only the regression gate (skip the full headline suite and its README refresh)'
        required: false
        default: false
        type: boolean
      update_baseline:
        description: 'Gate job: record this run as a candidate baseline (uploaded as an artifact) instead of checking against benchmarks/baseline.json'
        required: false
        default: false
        type: boolean
  issue_comment:
    types: [created]

# Read-only by default. Each job widens only what it uses, and `issues: write` is held by the
# notification job alone, which runs no repository code (same shape as mutation.yml and fuzz.yml).
permissions:
  contents: read

jobs:
  run-benchmarks:
    name: Run BenchmarkDotNet Performance Suite
    permissions:
      contents: write
      pull-requests: write
    # Run on scheduled cron, manual dispatch (unless gate_only), OR when an authorized user
    # comments /benchmark on a PR
    if: |
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && !inputs.gate_only) ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       contains(fromJson('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) &&
       startsWith(github.event.comment.body, '/benchmark'))
    runs-on: ubuntu-latest

    steps:
      - name: Resolve Target PR Branch and Execution Options
        id: pr_info
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
          TARGET_BRANCH_INPUT: ${{ github.event.inputs.target_branch }}
          REF_NAME: ${{ github.ref_name }}
          JOB_PRESET_INPUT: ${{ github.event.inputs.job_preset }}
          SCALE_INPUT: ${{ github.event.inputs.scale }}
          FILTER_INPUT: ${{ github.event.inputs.filter }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ]; then
            echo "branch=main" >> "$GITHUB_OUTPUT"
            echo "is_pr=false" >> "$GITHUB_OUTPUT"
            echo "commit_results=true" >> "$GITHUB_OUTPUT"
            echo "job_flag=--job default" >> "$GITHUB_OUTPUT"
            echo "params_flag=" >> "$GITHUB_OUTPUT"
            echo "filter=*" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_NAME" = "issue_comment" ]; then
            # Extract PR branch name via GitHub CLI
            branch=$(gh pr view "$ISSUE_NUMBER" --repo "$REPO" --json headRefName -q .headRefName)
            echo "branch=$branch" >> "$GITHUB_OUTPUT"
            echo "is_pr=true" >> "$GITHUB_OUTPUT"
            echo "pr_number=$ISSUE_NUMBER" >> "$GITHUB_OUTPUT"
            echo "commit_results=false" >> "$GITHUB_OUTPUT"

            # Job preset choice: default to --job short unless --deep or --default is specified
            if echo "$COMMENT_BODY" | grep -q -- "--deep" || echo "$COMMENT_BODY" | grep -q -- "--default"; then
              job_flag="--job default"
            else
              # --job short: 3 warmup, 3 measurement iterations
              job_flag="--job short"
            fi

            # Scale choices:
            # - /benchmark (default): full scale (1K, 10K, 100K, 1M) with short job
            # - /benchmark --1m: only 1,000,000 rows
            # - /benchmark --100k: up to 100,000 rows
            # - /benchmark --quick: 1K, 10K rows
            if echo "$COMMENT_BODY" | grep -q -- "--1m"; then
              params_flag="--params Count=1000000"
            elif echo "$COMMENT_BODY" | grep -q -- "--quick"; then
              params_flag="--params Count=1000,10000"
            elif echo "$COMMENT_BODY" | grep -q -- "--100k"; then
              params_flag="--params Count=1000,10000,100000"
            else
              params_flag=""
            fi

            echo "job_flag=$job_flag" >> "$GITHUB_OUTPUT"
            echo "params_flag=$params_flag" >> "$GITHUB_OUTPUT"

            # Parse optional filter (ignoring flags like --job, --1m, etc.)
            raw_filter=$(echo "$COMMENT_BODY" | tr ' ' '\n' | grep -v '^/benchmark' | grep -v '^-' | head -n 1)
            # Allow only alphanumeric and safe glob chars: letters, digits, _, ., *, ~, -
            if [ -n "$raw_filter" ] && [[ "$raw_filter" =~ ^[a-zA-Z0-9_.*~-]+$ ]]; then
              echo "filter=$raw_filter" >> "$GITHUB_OUTPUT"
            else
              echo "filter=*" >> "$GITHUB_OUTPUT"
            fi
          else
            target="$TARGET_BRANCH_INPUT"
            if [ -n "$target" ]; then
              echo "branch=$target" >> "$GITHUB_OUTPUT"
            else
              echo "branch=$REF_NAME" >> "$GITHUB_OUTPUT"
            fi
            echo "is_pr=false" >> "$GITHUB_OUTPUT"
            echo "commit_results=true" >> "$GITHUB_OUTPUT"
            job_preset="${JOB_PRESET_INPUT:-short}"
            echo "job_flag=--job $job_preset" >> "$GITHUB_OUTPUT"

            case "$SCALE_INPUT" in
              1m) echo "params_flag=--params Count=1000000" >> "$GITHUB_OUTPUT" ;;
              100k) echo "params_flag=--params Count=1000,10000,100000" >> "$GITHUB_OUTPUT" ;;
              quick) echo "params_flag=--params Count=1000,10000" >> "$GITHUB_OUTPUT" ;;
              *) echo "params_flag=" >> "$GITHUB_OUTPUT" ;;
            esac

            filter="${FILTER_INPUT:-*}"
            if [[ "$filter" =~ ^[a-zA-Z0-9_.*~-]+$ ]]; then
              echo "filter=$filter" >> "$GITHUB_OUTPUT"
            else
              echo "filter=*" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.pr_info.outputs.branch }}
          fetch-depth: 0
          lfs: true
          # Checkout would otherwise persist a GITHUB_TOKEN Authorization header that wins over any
          # token in a remote URL, so a push meant to start workflows would be made by GITHUB_TOKEN
          # and start none (#568). The push step authenticates explicitly instead.
          persist-credentials: false

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore benchmarks/Parquet.SourceGenerator.Benchmarks/Parquet.SourceGenerator.Benchmarks.csproj --locked-mode

      - name: Build benchmarks (Release)
        run: dotnet build benchmarks/Parquet.SourceGenerator.Benchmarks/Parquet.SourceGenerator.Benchmarks.csproj --configuration Release --no-restore

      - name: Execute BenchmarkDotNet Suite
        env:
          FILTER: ${{ steps.pr_info.outputs.filter }}
          JOB_FLAG: ${{ steps.pr_info.outputs.job_flag }}
          PARAMS_FLAG: ${{ steps.pr_info.outputs.params_flag }}
        run: |
          echo "Executing: dotnet run -c Release --no-build -- --filter '$FILTER' $JOB_FLAG $PARAMS_FLAG"
          dotnet run -c Release --project benchmarks/Parquet.SourceGenerator.Benchmarks/Parquet.SourceGenerator.Benchmarks.csproj --no-build -- --filter "$FILTER" $JOB_FLAG $PARAMS_FLAG

      # The thresholds are the noise filter (#568): a scheduled run on a shared runner would otherwise
      # rewrite the table, and open a pull request, every week from timing noise alone. The README is
      # only rewritten when a row moves more than 10% in allocation or 30% in time, or a row appears,
      # disappears or changes scale. Allocation is near-deterministic, so 10% is signal; timing
      # moves tens of percent between identical runs, so only a large change is.
      - name: Generate Headline Benchmark Summary & Update READMEs
        run: |
          dotnet run -c Release --project tools/BenchmarkSummaryGenerator/BenchmarkSummaryGenerator.csproj -- BenchmarkDotNet.Artifacts/results benchmark-summary.md --update-readme --alloc-threshold 0.10 --time-threshold 0.30
          cat benchmark-summary.md >> $GITHUB_STEP_SUMMARY

      # A pull request opened with GITHUB_TOKEN starts no workflows, so it never receives the required
      # `build` and `pr-title` checks and can never merge (#568; #474 sat that way for weeks), and a
      # later push to its branch with GITHUB_TOKEN starts none either. This step therefore pushes and
      # opens the PR with WORKFLOW_PR_TOKEN, a fine-grained personal access token the owner creates
      # (docs/51-CI-GATE-MATRIX.md, R11). When it is absent the headline PR is NOT opened: the table
      # is in the job summary and the results artifact, and the run says so.
      - name: Commit & Push Benchmark Updates to Branch
        if: steps.pr_info.outputs.commit_results == 'true'
        env:
          BRANCH: ${{ steps.pr_info.outputs.branch }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RUN_ID: ${{ github.run_id }}
          PR_TOKEN: ${{ secrets.WORKFLOW_PR_TOKEN }}
          DEFAULT_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md PACKAGE_README.md
          if git diff --cached --quiet; then
            echo "No benchmark moved past the noise thresholds; README benchmark tables left as committed."
            echo "Headline table left as committed: no benchmark moved past the noise thresholds." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ "$BRANCH" = "$DEFAULT_BRANCH" ] && [ -z "${PR_TOKEN:-}" ]; then
            # Not a failure and not a PR without checks: say what was skipped and why.
            msg="WORKFLOW_PR_TOKEN is not configured, so the headline table pull request was not opened. A pull request opened with GITHUB_TOKEN gets no required checks and cannot merge (#568). The refreshed table is in this run's summary and in the benchmark-results artifact. See docs/51-CI-GATE-MATRIX.md (R11) for the secret to create."
            echo "::notice title=Headline PR not opened::$msg"
            echo "$msg" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git commit -m "docs(perf): update benchmark headline performance table in README"

          # Push and open the PR as the token's owner so the push and the PR start workflows. Checkout
          # keeps no credentials (persist-credentials: false), so the remote carries the token: the
          # PR token when there is one, otherwise the default token for a branch push only.
          git remote add push-target "https://x-access-token:${PR_TOKEN:-$DEFAULT_TOKEN}@github.com/${REPO}.git"
          push_remote=push-target

          if [ "$BRANCH" = "$DEFAULT_BRANCH" ]; then
            # Direct pushes to the default branch are blocked by branch protection
            # (AGENTS.md rule 4), which silently failed every scheduled headline
            # refresh until #188. Land through a PR instead, as BENCHMARKS.md always
            # claimed this workflow does.
            update_branch="perf/benchmark-headline-$RUN_ID"
            git checkout -b "$update_branch"
            git push "$push_remote" "$update_branch"
            GH_TOKEN="$PR_TOKEN" gh pr create --repo "$REPO" --base "$DEFAULT_BRANCH" --head "$update_branch" \
              --title "docs(perf): update benchmark headline performance table" \
              --body "Automated headline refresh from [run $RUN_ID](https://github.com/$REPO/actions/runs/$RUN_ID). The table moved more than the noise thresholds (10% allocation, 30% time). Per-class detailed reports are in the run's \`benchmark-results\` artifact."
          else
            if [ -z "${PR_TOKEN:-}" ]; then
              echo "::warning title=No checks on this push::WORKFLOW_PR_TOKEN is not configured, so this push to $BRANCH starts no workflows and the pull request will not get fresh checks (#568)."
            fi
            git push "$push_remote" "HEAD:refs/heads/$BRANCH"
          fi

      - name: Comment Benchmark Summary on PR
        if: steps.pr_info.outputs.is_pr == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr_info.outputs.pr_number }}
          REPO: ${{ github.repository }}
        run: |
          gh pr comment "$PR_NUMBER" --repo "$REPO" --body-file benchmark-summary.md

      - name: Upload Benchmark Results Artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: benchmark-results
          path: |
            BenchmarkDotNet.Artifacts/results/*.csv
            BenchmarkDotNet.Artifacts/results/*.html
            BenchmarkDotNet.Artifacts/results/*.md
            BenchmarkDotNet.Artifacts/results/*.json

  # The regression gate (#404, #412, #408, #469). It is its own job, with its own small run, for
  # three reasons. The headline suite above is the whole library at several scales and takes far
  # too long to gate on. Gating a curated set means the baseline can hold only what is stable on a
  # shared runner: allocated bytes, not wall-clock. And a gate that shares a job with a PR-opening
  # step fails or passes with it; this one only reads.
  #
  # The set lives in benchmarks/gate-filter.txt, the reference in benchmarks/baseline.json (keyed
  # by class + method + parameters). The runtime is pinned to .NET 8 with DOTNET_ROLL_FORWARD
  # because the benchmark project rolls forward to the latest installed major, and allocations
  # differ between runtimes.
  regression-gate:
    name: Allocation regression gate
    if: |
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      BENCHMARK_BASELINE: benchmarks/baseline.json
      BENCHMARK_GATE_FILTER: benchmarks/gate-filter.txt
      # The gated run only ever uses these two scales; the baseline holds exactly them.
      GATE_COUNTS: 'Count=1000,10000'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.inputs.target_branch || github.ref_name }}
          lfs: true

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore benchmarks/Parquet.SourceGenerator.Benchmarks/Parquet.SourceGenerator.Benchmarks.csproj --locked-mode

      - name: Build benchmarks (Release)
        run: dotnet build benchmarks/Parquet.SourceGenerator.Benchmarks/Parquet.SourceGenerator.Benchmarks.csproj --configuration Release --no-restore

      - name: Execute the gated benchmarks
        env:
          DOTNET_ROLL_FORWARD: Minor
        run: |
          set -euo pipefail
          mapfile -t filters < <(grep -v -e '^[[:space:]]*#' -e '^[[:space:]]*$' "$BENCHMARK_GATE_FILTER")
          if [ "${#filters[@]}" -eq 0 ]; then
            echo "::error::$BENCHMARK_GATE_FILTER lists no benchmarks. A gate that runs nothing passes vacuously."
            exit 1
          fi
          echo "Gated benchmarks (${#filters[@]}):"
          printf '  %s\n' "${filters[@]}"
          dotnet run -c Release --project benchmarks/Parquet.SourceGenerator.Benchmarks/Parquet.SourceGenerator.Benchmarks.csproj --no-build -- \
            --filter "${filters[@]}" --params "$GATE_COUNTS" --artifacts BenchmarkDotNet.Artifacts/gate

      - name: Record a candidate baseline
        if: github.event_name == 'workflow_dispatch' && inputs.update_baseline
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # Never written back to the repository from here: a recording made on a shared runner is
          # proposed as an artifact, and a person commits it after reading the diff (#412).
          dotnet run -c Release --project tools/BenchmarkSummaryGenerator/BenchmarkSummaryGenerator.csproj -- \
            BenchmarkDotNet.Artifacts/gate/results --baseline candidate-baseline.json --update-baseline \
            --recorded-on "GitHub Actions ubuntu-latest, $RUN_URL"
          echo "Candidate baseline recorded: download the \`benchmark-baseline-candidate\` artifact, review the diff against $BENCHMARK_BASELINE, and commit it in a pull request." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the candidate baseline
        if: github.event_name == 'workflow_dispatch' && inputs.update_baseline
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: benchmark-baseline-candidate
          path: candidate-baseline.json
          if-no-files-found: error

      # The point of the whole regression-check machinery: without this step
      # RegressionCheck.cs, HasFailures and the allocation tolerance gate nothing (#404).
      - name: Benchmark Regression Gate
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.update_baseline) }}
        run: |
          set -euo pipefail

          # A missing or empty baseline must fail rather than bootstrap itself green: the tool
          # cannot tell "first ever run" from "somebody deleted the reference" (#412), and a run
          # that records its own regressed numbers as the new truth hides them forever after.
          if [ ! -f "$BENCHMARK_BASELINE" ]; then
            echo "::error::No benchmark baseline at '$BENCHMARK_BASELINE'. Record one (docs/BENCHMARKS.md) and commit it."
            exit 1
          fi

          measurements=$(jq '(.measurements // []) | length' "$BENCHMARK_BASELINE")
          if [ -z "$measurements" ] || [ "$measurements" = "null" ] || [ "$measurements" -eq 0 ]; then
            echo "::error::Baseline '$BENCHMARK_BASELINE' contains no measurements. Re-record it."
            exit 1
          fi
          echo "Checking against $measurements baseline measurement(s)."

          before=$(sha256sum "$BENCHMARK_BASELINE" | cut -d' ' -f1)

          # --fail-on-not-run: every baseline benchmark must have executed, or one vanished.
          # --fail-on-new: every executed benchmark must be in the baseline, or it is ungated.
          # --no-time: the baseline was recorded on other hardware, so wall-clock is not compared.
          set +e
          dotnet run -c Release --project tools/BenchmarkSummaryGenerator/BenchmarkSummaryGenerator.csproj \
            -- BenchmarkDotNet.Artifacts/gate/results --baseline "$BENCHMARK_BASELINE" --report benchmark-regression.md \
            --fail-on-not-run --fail-on-new --no-time
          status=$?
          set -e

          if [ -f benchmark-regression.md ]; then
            cat benchmark-regression.md >> "$GITHUB_STEP_SUMMARY"
          fi

          after=$(sha256sum "$BENCHMARK_BASELINE" | cut -d' ' -f1)
          if [ "$before" != "$after" ]; then
            echo "::error::The regression check rewrote its own baseline. A check run must never modify '$BENCHMARK_BASELINE'."
            exit 1
          fi

          exit $status

      - name: Upload gate results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: benchmark-gate-results
          path: |
            BenchmarkDotNet.Artifacts/gate/results/*.json
            BenchmarkDotNet.Artifacts/gate/results/*.csv
            benchmark-regression.md
          if-no-files-found: warn

  # A scheduled gate that only turns red is muted by its own history (#564). When a job above
  # fails on the Sunday schedule, open one `area:ci` issue, or comment on the open one. A separate
  # job so the jobs that run repository code never hold `issues: write`; it needs no checkout.
  # Same pattern as mutation.yml, fuzz.yml and metrics-oracle.yml.
  notify-failure:
    name: Report scheduled failure
    needs: [run-benchmarks, regression-gate]
    if: ${{ always() && github.event_name == 'schedule' && (needs.run-benchmarks.result == 'failure' || needs.regression-gate.result == 'failure') }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update the failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HEADLINE_RESULT: ${{ needs.run-benchmarks.result }}
          GATE_RESULT: ${{ needs.regression-gate.result }}
        run: |
          set -euo pipefail
          title="[CI] scheduled benchmarks failed"
          body="The scheduled benchmarks workflow failed: [run]($RUN_URL). Headline suite: $HEADLINE_RESULT. Regression gate: $GATE_RESULT. Open the run for the failing step; the gate's report is in the job summary. This issue is updated with a comment on each further failure; close it once the workflow is green again."
          gh label create "area:ci" --color B60205 --description "CI and workflow gates" >/dev/null 2>&1 || true
          existing=$(gh issue list --state open --label "area:ci" --search "\"$title\" in:title" \
            --json number,title --jq "[.[] | select(.title == \"$title\")][0].number // empty")
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Failed again: [run]($RUN_URL). Headline suite: $HEADLINE_RESULT. Regression gate: $GATE_RESULT."
          else
            gh issue create --title "$title" --body "$body" --label "area:ci"
          fi
