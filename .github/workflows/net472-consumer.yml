name: net472 Legacy consumer (executed)

# The Legacy package exists for .NET Framework. ci.yml compiles PackageConsumptionLegacy for net472
# on Ubuntu, which proves it builds and nothing about running it (#565). This workflow executes it
# on a real .NET Framework runtime: write, read, the compression/batching/schema-evolution
# scenarios, the blocked-SynchronizationContext round trip, and a file hand-off in both directions
# with the same consumer on net8.0.
#
# Deliberately NOT part of the required `build` aggregate and not a job in ci.yml: a Windows runner
# is slower and costs more minutes, and a flaky required job would block every merge. It reports on
# every relevant pull request and push to main; promote it into `build` (add the job to ci.yml and
# to `needs`) once it has a clean record. docs/51-CI-GATE-MATRIX.md tracks that decision.
#
# It builds its own two packages (Attributes and Legacy are all the consumer restores) instead of
# downloading ci.yml's artifact, because artifacts do not cross workflows without extra token scopes.

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'test/PackageConsumptionLegacy/**'
      - 'test/CrossVersionInterop/**'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'global.json'
      - '.github/workflows/net472-consumer.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'test/PackageConsumptionLegacy/**'
      - 'test/CrossVersionInterop/**'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'global.json'
      - '.github/workflows/net472-consumer.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  net472-consumer:
    name: net472-consumer
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Pack the Attributes and Legacy packages
        run: |
          set -euo pipefail
          dotnet pack src/Parquet.SourceGenerator.Attributes/Parquet.SourceGenerator.Attributes.csproj \
            --configuration Release --output artifacts -p:Version=0.0.0-net472.1
          dotnet pack src/Parquet.SourceGenerator.Legacy/Parquet.SourceGenerator.Legacy.csproj \
            --configuration Release --output artifacts -p:Version=0.0.0-net472.1
          ls artifacts

      # Executed, not compiled: `dotnet run` starts the net472 executable on the .NET Framework
      # runtime of the runner. A missing method, binding redirect or System.Memory version skew
      # fails here and passed ci.yml's compile-only step.
      - name: Run the Legacy consumer on .NET Framework 4.7.2
        run: |
          set -euo pipefail
          dotnet run --project test/PackageConsumptionLegacy/PackageConsumptionLegacy.csproj \
            --framework net472 --configuration Release \
            -p:GeneratorPackageVersion=0.0.0-net472.1 \
            -p:RestorePackagesPath="$RUNNER_TEMP/consumption-packages-legacy-net472"

      # The same file format has to cross runtimes: written by .NET Framework and read on .NET 8,
      # and the reverse. Each leg prints the producer so a mislabelled run is visible.
      - name: Hand a file between .NET Framework 4.7.2 and .NET 8
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/net472-interop"
          mkdir -p "$dir"
          project=test/PackageConsumptionLegacy/PackageConsumptionLegacy.csproj
          net472=(dotnet run --project "$project" --framework net472 --configuration Release
            -p:GeneratorPackageVersion=0.0.0-net472.1
            -p:RestorePackagesPath="$RUNNER_TEMP/consumption-packages-legacy-net472")
          net8=(dotnet run --project "$project" --framework net8.0 --configuration Release
            -p:GeneratorPackageVersion=0.0.0-net472.1
            -p:RestorePackagesPath="$RUNNER_TEMP/consumption-packages-legacy-net8")

          "${net472[@]}" -- --write-interop "$dir/net472.parquet"
          "${net8[@]}" -- --read-interop "$dir/net472.parquet" classic/net472
          "${net8[@]}" -- --write-interop "$dir/net8.parquet"
          "${net472[@]}" -- --read-interop "$dir/net8.parquet" classic/net8.0
