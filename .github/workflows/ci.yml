name: CI & PR E2E Checks

on:
  push:
    branches: [ main ]
  # Deliberately unfiltered by base branch. `branches: [ main ]` here means a pull request based on
  # anything other than main never runs this workflow — so every stacked pull request reported green
  # off `pr-title` alone, having never been built or tested. The repository's own workflow policy
  # (AGENTS.md) expects stacked, rebased branches, so the filter and the workflow were in conflict.
  pull_request:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The job name is the check name that branch protection matches on, so it is deliberately short,
  # lowercase, and free of characters that are easy to mistype or that GitHub HTML-escapes when a
  # doc is rendered. Treat it as an identifier: renaming it silently breaks any ruleset requiring it.
  build:
    name: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: true

      # Policy: Python (.py) files are strictly forbidden in this repository, with the sole exception
      # of scripts/generate_test_data.py used to generate cross-engine PyArrow format-compatibility datasets.
      # All automation, benchmarks, and tooling must be authored in C# (.cs) executed via dotnet run.
      - name: Enforce No Python Files Policy (Excluding PyArrow Test Data Generator)
        run: |
          echo "Scanning repository for forbidden Python (.py) files..."
          forbidden_py=$(git ls-files '*.py' | grep -v '^scripts/generate_test_data\.py$' || true)
          if [ -n "$forbidden_py" ]; then
            echo "::error::Unauthorized Python (.py) files found in repository:"
            echo "$forbidden_py"
            echo "All new scripts, benchmarks, and tooling must be authored in C# (.cs)."
            exit 1
          fi
          echo "Policy verified: Only authorized test data generator found."

      - name: Verify No Python Files in PR Diff
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          echo "Checking PR diff for forbidden Python (.py) files..."
          git fetch origin "$BASE_REF" --depth=1
          new_py=$(git diff --name-only --diff-filter=ACMR "origin/$BASE_REF...HEAD" | grep -E '\.py$' | grep -v '^scripts/generate_test_data\.py$' || true)
          if [ -n "$new_py" ]; then
            echo "::error::Pull request introduces forbidden Python (.py) files:"
            echo "$new_py"
            echo "Python files cannot be added to the repository. Author scripts in C# (.cs) instead."
            exit 1
          fi
          echo "PR diff check passed: zero unauthorized Python files introduced."

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Verify Benchmark Data LFS Hydration & Provenance Integrity
        run: dotnet run scripts/VerifyProvenance.cs

      - name: Verify Changelog Structure
        run: dotnet run scripts/ParseChangelog.cs

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Restore solution dependencies
        run: dotnet restore Parquet.SourceGenerator.slnx

      - name: Audit Package Security & Vulnerabilities
        run: |
          audit_output=$(dotnet list package --vulnerable --include-transitive)
          echo "$audit_output"
          if echo "$audit_output" | grep -qi 'has the following vulnerable packages'; then
            echo "::error::Vulnerable packages detected in solution dependencies!"
            exit 1
          fi

      # CSharpier is the ONLY C# layout formatter in this repo. `dotnet format whitespace` was
      # retired from CI: its Roslyn formatter disagrees with CSharpier on layout (case-body and
      # pattern-arm indentation, per dotnet/format#2262) and in workspace mode it policed nothing
      # beyond .cs anyway. IDE0055 is disabled in .editorconfig so no Roslyn-based formatter —
      # build, IDE, or CLI — fights CSharpier over .cs layout. Line endings for non-C# files are
      # guaranteed by .gitattributes (eol=lf) plus the [*] hygiene keys in .editorconfig.
      #
      # Do not reintroduce plain `dotnet format` either: its style/analyzer phases build a Roslyn
      # workspace via MSBuildWorkspace, which does not execute source generators — it reports
      # bogus CS1503 against every call into the generated *ParquetExtensions API. Non-layout
      # style rules are enforced by the build below, via EnforceCodeStyleInBuild plus
      # -warnaserror, which uses the real compilation where generators do run.
      - name: Restore local tools
        run: |
          # Workaround for dotnet/sdk #53783: cold tool-resolver cache can misattribute package commands on initial restore
          dotnet tool restore --disable-parallel || dotnet tool restore --disable-parallel

      - name: Verify C# Code Formatting (CSharpier)
        run: dotnet csharpier check .

      # The CI half of the API change contract (docs/18-API-CHANGE-CONTRACT.md). Build errors
      # PARQAPI001 and PARQAPI002 enforce "nothing exists outside a catalogue"; this enforces the
      # other half — "nothing is catalogued without a recorded semver decision" — which needs the
      # diff against the pull request's base and so cannot live in an analyzer. It also rejects the
      # `**Unapproved-by-design:**` escape-hatch marker, which suppresses those build errors for a
      # spike and must never reach main.
      - name: Verify API Change Ledger
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: dotnet run scripts/CheckApiLedger.cs

      - name: Build solution (Release)
        run: dotnet build Parquet.SourceGenerator.slnx --configuration Release --no-restore -warnaserror

      # Layers 1 and 2 of #251 (docs/21-CODE-METRICS.md, docs/22-GENERATED-CODE-METRICS.md). The
      # build above already enforces CA1502 / CA1505 / CA1506 against the thresholds in
      # CodeMetricsConfig.txt, which is an absolute judgement and therefore the weaker half. This
      # is the other half: checked-in, ordinal baselines of Roslyn's maintainability index,
      # cyclomatic complexity, class coupling, inheritance depth and line counts, gated on DRIFT
      # rather than on an absolute number — for every namespace, type and member under src/
      # (metrics/*.metrics.txt), and for every emitted golden model
      # (GoldenFiles/*.metrics.txt). It also validates CodeMetricsConfig.txt, because a single
      # unrecognised entry in that file silently disables all three analyzers.
      #
      # This step is what proves cross-platform determinism: the baselines are regenerated here on
      # ubuntu-latest / x64 from files a contributor generated on their own machine, and compared
      # with no tolerance at all on every metric but one.
      #
      # It runs `dotnet run` on a file-based app whose Roslyn version is pinned in the script, so
      # the numbers do not move when the runner's SDK does. NU1903 on Microsoft.Build.Tasks.Core
      # and on Snappier is expected and unavoidable here: they are transitive dependencies of
      # Microsoft.CodeAnalysis.Workspaces.MSBuild and of the Parquet.Net 4.25.0 pin the legacy
      # golden file is measured against, no code from either is executed (MSBuildLocator binds the
      # SDK's copy of the former; the latter is loaded only as a Roslyn metadata reference), and
      # both are outside the solution the audit step above governs.
      - name: Verify Code Metrics Baselines
        run: |
          status=0
          dotnet run scripts/CodeMetrics.cs -- --summary code-metrics.md || status=$?
          if [ -f code-metrics.md ]; then
            cat code-metrics.md >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $status

      # Layer 3 of #251 (docs/23-DUPLICATION.md): token-level duplication across src/, gated on
      # drift with zero tolerance — the layers 1 and 2 grammar. Emitted code is out of scope by
      # design; generated output repeating itself is the design, not a defect.
      - name: Verify Duplication Baseline
        run: |
          status=0
          dotnet run scripts/Duplication.cs -- --summary duplication.md || status=$?
          if [ -f duplication.md ]; then
            cat duplication.md >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $status

      # #252: the call graph — structure as a gated artifact. Edge drift, declared
      # cycles (graph/callgraph.allowlist.txt), the fan-out ratchet, and the
      # components-must-not-call-the-hub layering rule. docs/25-CALL-GRAPH.md states
      # what the static approximation cannot see; the unresolved count rides in the
      # baseline header so the blind spot is measured, not hidden.
      - name: Verify Call-Graph Baselines
        run: |
          status=0
          dotnet run scripts/CallGraph.cs || status=$?
          if [ -f graph/callgraph-summary.md ]; then
            cat graph/callgraph-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $status

      # Dataset hash integrity is a gate on the COMMITTED bytes, so it must run
      # before any generated compatibility datasets are created. The pinned
      # hashes in test/data/fixture-manifest.json match the checked-in files only.
      - name: Verify Checked-In Dataset Hash Integrity (pre-regeneration)
        run: dotnet test Parquet.SourceGenerator.slnx --configuration Release --no-build --filter "Category=DatasetIntegrity" --verbosity normal

      - name: Generate Python Test Datasets (PyArrow v1 & v2)
        env:
          PARQUET_TEST_DATA_OUTPUT_DIR: ${{ runner.temp }}/parquet-source-generator/data
        run: uv run scripts/generate_test_data.py

      - name: Generate C# Test Datasets (Parquet.Net)
        env:
          PARQUET_TEST_DATA_CSHARP_OUTPUT_DIR: ${{ runner.temp }}/parquet-source-generator/data_csharp
        run: dotnet run --project test/Parquet.SourceGenerator.CLI/Parquet.SourceGenerator.CLI.csproj

      - name: Generate C# PyArrow Interop Output
        env:
          PARQUET_PYARROW_INTEROP_OUTPUT: ${{ runner.temp }}/parquet-source-generator/generated-csharp.parquet
        run: dotnet run --project test/Parquet.SourceGenerator.CLI/Parquet.SourceGenerator.CLI.csproj -- --pyarrow-output "$PARQUET_PYARROW_INTEROP_OUTPUT"

      - name: Verify Generated Output With PyArrow
        env:
          PARQUET_PYARROW_INTEROP_OUTPUT: ${{ runner.temp }}/parquet-source-generator/generated-csharp.parquet
        run: uv run scripts/generate_test_data.py --verify-generated "$PARQUET_PYARROW_INTEROP_OUTPUT"

      - name: Install DuckDB CLI
        env:
          DUCKDB_VERSION: 1.5.4
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/duckdb"
          curl --fail --silent --show-error --location \
            "https://github.com/duckdb/duckdb/releases/download/v${DUCKDB_VERSION}/duckdb_cli-linux-amd64.zip" \
            --output "$RUNNER_TEMP/duckdb/duckdb.zip"
          unzip -oq "$RUNNER_TEMP/duckdb/duckdb.zip" -d "$RUNNER_TEMP/duckdb"
          chmod +x "$RUNNER_TEMP/duckdb/duckdb"
          echo "DUCKDB_BIN=$RUNNER_TEMP/duckdb/duckdb" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/duckdb/duckdb" --version

      - name: Verify Generated Output With DuckDB
        run: |
          dotnet run scripts/VerifyDuckDbInterop.cs -- \
            --duckdb "$DUCKDB_BIN" \
            --generated "$RUNNER_TEMP/parquet-source-generator/generated-csharp.parquet" \
            --output "$RUNNER_TEMP/parquet-source-generator/generated-duckdb.parquet"

      # Apache conformance (#167): independent file-format validation of every generated and
      # checked-in fixture with the pinned parquet-cli in test/data/apache-conformance.json.
      # Temurin 17 is part of the pin: the tool rides on Hadoop's UserGroupInformation, which
      # newer JDKs refuse. Every SHA-256 is re-verified from the manifest before use, and all
      # tool dumps plus the source and corrupt files are uploaded when this gate fails.
      - name: Setup Java (Apache Parquet conformance tooling)
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore Apache Parquet Conformance Tooling
        run: dotnet run scripts/VerifyApacheConformance.cs -- --restore "$RUNNER_TEMP/apache-parquet-tools"

      - name: Verify Apache Parquet Conformance
        run: |
          dotnet run scripts/VerifyApacheConformance.cs -- \
            --tools-dir "$RUNNER_TEMP/apache-parquet-tools" \
            --generated "$RUNNER_TEMP/parquet-source-generator/generated-csharp.parquet" \
            --output-dir "$RUNNER_TEMP/apache-conformance"

      - name: Upload Apache Conformance Evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: apache-conformance-evidence
          path: ${{ runner.temp }}/apache-conformance/

      - name: Interrogate IL & Verify Zero Boxing Regression Gate
        run: dotnet run scripts/InterrogateIL.cs --assembly test/Parquet.SourceGenerator.CLI/bin/Release/net8.0/Parquet.SourceGenerator.CLI.dll --check

      - name: Run Full Test Suite with Code Coverage Collection
        env:
          PARQUET_TEST_DATA_ROOT: ${{ runner.temp }}/parquet-source-generator/data
          PARQUET_TEST_DATA_CSHARP_ROOT: ${{ runner.temp }}/parquet-source-generator/data_csharp
          # The version/schema-evolution matrix writes its per-cell record here so the run leaves
          # behind a compatibility report, not just a pass/fail.
          PARQUET_COMPAT_MATRIX_OUTPUT: ${{ runner.temp }}/parquet-source-generator/compatibility-matrix
        run: dotnet test Parquet.SourceGenerator.slnx --configuration Release --no-build --filter "Category!=DatasetIntegrity&Category!=ExternalInterop" --verbosity normal --collect:"XPlat Code Coverage" --settings coverlet.runsettings

      - name: Verify Generated Reader With PyArrow Fixture
        env:
          PARQUET_PYARROW_INTEROP_INPUT: ${{ runner.temp }}/parquet-source-generator/data/pyarrow_interop_input.parquet
          DUCKDB_INTEROP_INPUT: ${{ runner.temp }}/parquet-source-generator/generated-duckdb.parquet
        run: dotnet test Parquet.SourceGenerator.slnx --configuration Release --no-build --filter "Category=ExternalInterop" --verbosity normal

      - name: Generate Code Coverage Summary & Evaluate Gate
        run: |
          dotnet run scripts/CoverageSummary.cs -- --output-markdown coverage-summary.md --min-line 85.0 --min-branch 70.0
          cat coverage-summary.md >> $GITHUB_STEP_SUMMARY

      - name: Post or Update Code Coverage PR Sticky Comment
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          marker="<!-- parquet-code-coverage-report -->"
          comment_id=$(gh api "repos/$REPO/issues/${PR_NUMBER}/comments" \
            --jq ".[] | select(.body | contains(\"$marker\")) | .id" | head -n 1)

          if [ -n "$comment_id" ]; then
            echo "Updating existing PR coverage comment ($comment_id)..."
            gh api -X PATCH "repos/$REPO/issues/comments/$comment_id" -F body=@coverage-summary.md
          else
            echo "Posting new PR coverage comment..."
            gh pr comment "$PR_NUMBER" --repo "$REPO" --body-file coverage-summary.md
          fi

      - name: Execute Sample (CoreCLR)
        run: dotnet run --project samples/Parquet.SourceGenerator.SampleAot/Parquet.SourceGenerator.SampleAot.csproj --configuration Release

      # The step above does NOT verify Native AOT: `dotnet run` executes under CoreCLR and ignores
      # PublishAot entirely, so the pipeline claimed an AOT guarantee it never tested. This is the
      # real thing — `publish -r` invokes the ILCompiler, which fails the build on trim/AOT
      # violations, and then the produced binary is executed with no runtime installed for it to
      # fall back to.
      #
      # AotTest is the right project to do it with: it round-trips through the generated serializer
      # and throws on mismatch, so a native binary exiting 0 is a genuine end-to-end result. It has
      # existed since the beginning and no workflow ever invoked it.
      - name: Verify Native AOT (publish + run native binary)
        run: |
          set -euo pipefail
          dotnet publish test/Parquet.SourceGenerator.AotTest/Parquet.SourceGenerator.AotTest.csproj \
            --configuration Release -r linux-x64 -o ./aot-out 2>&1 | tee aot-publish.log

          test -x ./aot-out/Parquet.SourceGenerator.AotTest \
            || { echo "FAIL: no native executable produced"; ls -la ./aot-out; exit 1; }

          echo "::group::trim / AOT-analysis warnings reported during publish"
          grep -E 'warning IL[0-9]+' aot-publish.log || echo "(none)"
          echo "::endgroup::"

          # Parquet.Net is not AOT-clean and we cannot fix that from here, so warnings attributed to
          # Parquet.dll are tolerated. Warnings attributed to anything else mean this repository's
          # own code — or the code it generates — has started depending on reflection or on metadata
          # the trimmer will remove. That is a regression, and it is invisible without this check
          # because IL warnings do not fail a build.
          if grep -E 'warning IL[0-9]+' aot-publish.log | grep -v '/Parquet\.dll ' | grep -q .; then
            echo "FAIL: trim/AOT warnings not attributable to Parquet.Net:"
            grep -E 'warning IL[0-9]+' aot-publish.log | grep -v '/Parquet\.dll '
            exit 1
          fi

          # A native image has no .dll of the same name beside it to be run by the shared runtime;
          # invoking the file directly is what proves this is the compiled binary and not an
          # apphost shim. The matrix inside covers every property kind, every read/write entry
          # point and every compression codec, because AOT reflection failures surface at runtime
          # rather than at compile time.
          ./aot-out/Parquet.SourceGenerator.AotTest

      - name: Pack All NuGet Packages
        run: dotnet pack Parquet.SourceGenerator.slnx --configuration Release --no-build --output ./artifacts

      # Packing proves the packages build, not that they work. These steps consume them.
      - name: Verify Package Layout
        run: |
          set -euo pipefail
          cd artifacts
          gen=$(ls Parquet.SourceGenerator.[0-9]*.nupkg)
          genlegacy=$(ls Parquet.SourceGenerator.Legacy.[0-9]*.nupkg)
          attrs=$(ls Parquet.SourceGenerator.Attributes.*.nupkg)
          echo "::group::$gen contents"; unzip -Z1 "$gen"; echo "::endgroup::"
          echo "::group::$genlegacy contents"; unzip -Z1 "$genlegacy"; echo "::endgroup::"

          # The generator must ship as an analyzer and must NOT ship as a library: a lib/ entry
          # means consumers compile against the generator and its Roslyn-facing internals.
          unzip -Z1 "$gen" | grep -q '^analyzers/dotnet/cs/Parquet\.SourceGenerator\.dll$' \
            || { echo "FAIL: generator missing from analyzers/dotnet/cs/"; exit 1; }
          unzip -Z1 "$genlegacy" | grep -q '^analyzers/dotnet/cs/Parquet\.SourceGenerator\.Legacy\.dll$' \
            || { echo "FAIL: Legacy generator missing from analyzers/dotnet/cs/"; exit 1; }
          if unzip -Z1 "$gen" | grep -q '^lib/' || unzip -Z1 "$genlegacy" | grep -q '^lib/'; then
            echo "FAIL: generator package contains lib/ entries; it must be analyzer-only:"
            exit 1
          fi

          # Generated code references the attributes, so the dependency has to be declared.
          unzip -p "$gen" '*.nuspec' | grep -q 'id="Parquet.SourceGenerator.Attributes"' \
            || { echo "FAIL: generator .nuspec does not depend on the Attributes package"; exit 1; }
          unzip -p "$genlegacy" '*.nuspec' | grep -q 'id="Parquet.SourceGenerator.Attributes"' \
            || { echo "FAIL: Legacy generator .nuspec does not depend on the Attributes package"; exit 1; }

          # The attributes package is a real runtime library and must carry assemblies.
          for tfm in netstandard2.0 netstandard2.1 net8.0 net9.0; do
            unzip -Z1 "$attrs" | grep -q "^lib/$tfm/Parquet\.SourceGenerator\.Attributes\.dll$" \
              || { echo "FAIL: attributes package missing lib/$tfm"; exit 1; }
          done
          echo "Package layout OK."

      - name: Verify Package Consumption (v6 & Legacy packages on .NET 8 & .NET 9)
        run: |
          set -euo pipefail
          version=$(ls artifacts/Parquet.SourceGenerator.[0-9]*.nupkg \
            | sed -E 's/.*Parquet\.SourceGenerator\.([0-9][^/]*)\.nupkg/\1/')
          echo "Consuming Parquet.SourceGenerator $version and Legacy from local feed"
          dotnet run --project test/PackageConsumption/PackageConsumption.csproj \
            --framework net8.0 \
            --configuration Release \
            -p:GeneratorPackageVersion="$version" \
            -p:RestorePackagesPath="$RUNNER_TEMP/consumption-packages-net8"

          dotnet run --project test/PackageConsumption/PackageConsumption.csproj \
            --framework net9.0 \
            --configuration Release \
            -p:GeneratorPackageVersion="$version" \
            -p:RestorePackagesPath="$RUNNER_TEMP/consumption-packages-net9"

          dotnet run --project test/PackageConsumptionLegacy/PackageConsumptionLegacy.csproj \
            --framework net8.0 \
            --configuration Release \
            -p:GeneratorPackageVersion="$version" \
            -p:RestorePackagesPath="$RUNNER_TEMP/consumption-packages-legacy-net8"

          dotnet run --project test/PackageConsumptionLegacy/PackageConsumptionLegacy.csproj \
            --framework net9.0 \
            --configuration Release \
            -p:GeneratorPackageVersion="$version" \
            -p:RestorePackagesPath="$RUNNER_TEMP/consumption-packages-legacy-net9"

      # Neither in-solution tests nor the two steps above can cover the version axis of the
      # compatibility matrix: a test assembly references exactly one Parquet.Net, so nothing inside
      # it can prove that a file written against 6.x is readable by a consumer pinned to 4.25. These
      # two projects each reference a different Parquet.Net and compile the same shared model
      # (test/CrossVersionInterop/InteropModels.cs), so handing a file from one to the other is the
      # only place that leg gets exercised. The reader model is deliberately one version ahead of
      # the writer's — reordered columns plus two optional columns the file cannot contain — so the
      # handshake tests schema evolution across the version boundary rather than a bare round-trip.
      - name: Verify Cross-Version Interoperability (modern ⇄ legacy packages)
        run: |
          set -euo pipefail
          version=$(ls artifacts/Parquet.SourceGenerator.[0-9]*.nupkg \
            | sed -E 's/.*Parquet\.SourceGenerator\.([0-9][^/]*)\.nupkg/\1/')
          interop="$RUNNER_TEMP/parquet-source-generator/cross-version"
          matrix="$RUNNER_TEMP/parquet-source-generator/compatibility-matrix/cross-version.jsonl"
          mkdir -p "$interop" "$(dirname "$matrix")"

          modern=(dotnet run --project test/PackageConsumption/PackageConsumption.csproj
            --framework net8.0 --configuration Release
            -p:GeneratorPackageVersion="$version"
            -p:RestorePackagesPath="$RUNNER_TEMP/consumption-packages-net8")
          legacy=(dotnet run --project test/PackageConsumptionLegacy/PackageConsumptionLegacy.csproj
            --framework net8.0 --configuration Release
            -p:GeneratorPackageVersion="$version"
            -p:RestorePackagesPath="$RUNNER_TEMP/consumption-packages-legacy-net8")

          "${modern[@]}" -- --write-interop "$interop/modern.parquet"
          "${legacy[@]}" -- --read-interop "$interop/modern.parquet" modern/Parquet.Net-6.x "$matrix"

          "${legacy[@]}" -- --write-interop "$interop/legacy.parquet"
          "${modern[@]}" -- --read-interop "$interop/legacy.parquet" classic/Parquet.Net-4.25 "$matrix"

          echo "::group::cross-version matrix rows"; cat "$matrix"; echo "::endgroup::"

      # .NET Framework support is the entire reason the Legacy package exists, and until now nothing in
      # CI compiled it — the project declared net472 but every step above pins --framework to a
      # modern TFM, so the target was never built. Compiling is as far as a Linux runner can go
      # (executing net472 needs Windows or Mono), but it is what catches the failures that actually
      # occur here: generated code using a language feature net472's default LangVersion rejects, or
      # an API that only exists on .NET 6+.
      - name: Verify Legacy Package Consumption Compiles on .NET Framework 4.7.2
        run: |
          set -euo pipefail
          version=$(ls artifacts/Parquet.SourceGenerator.[0-9]*.nupkg \
            | sed -E 's/.*Parquet\.SourceGenerator\.([0-9][^/]*)\.nupkg/\1/')
          dotnet build test/PackageConsumptionLegacy/PackageConsumptionLegacy.csproj \
            --framework net472 \
            --configuration Release \
            -p:GeneratorPackageVersion="$version" \
            -p:RestorePackagesPath="$RUNNER_TEMP/consumption-packages-legacy-net472"

      - name: Upload Compatibility Matrix Report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: compatibility-matrix
          path: ${{ runner.temp }}/parquet-source-generator/compatibility-matrix
          if-no-files-found: warn

      - name: Upload Test Coverage Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: code-coverage
          path: test/Parquet.SourceGenerator.Tests/TestResults/*/coverage.cobertura.xml

      - name: Upload Build & Package Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nuget-packages
          path: ./artifacts/*.nupkg
