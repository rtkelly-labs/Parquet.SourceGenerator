name: CI & PR E2E Checks

on:
  push:
    branches: [ main ]
  # Deliberately unfiltered by base branch. `branches: [ main ]` here means a pull request based on
  # anything other than main never runs this workflow — so every stacked pull request reported green
  # off `pr-title` alone, having never been built or tested. The repository's own workflow policy
  # (AGENTS.md) expects stacked, rebased branches, so the filter and the workflow were in conflict.
  pull_request:

permissions:
  contents: read
  pull-requests: write

# A pull request's runs share one group, so a new push cancels the stale run. Each push to main gets
# a group of its own and is never cancelled: its `derived` job publishes the baseline that pull
# requests are diffed against, so every main commit has to finish. A shared group with
# cancel-in-progress off would not be enough — GitHub keeps one pending run per group, and a third
# push replaces the pending second.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Restore, build, test, pack and interop. Not itself a required check: the `build` job at the
  # end of this file aggregates it with `derived`, and that is what branch protection requires.
  test:
    name: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: true

      # Policy: Python (.py) files are strictly forbidden in this repository, with the sole exception
      # of scripts/generate_test_data.py used to generate cross-engine PyArrow format-compatibility datasets.
      # All automation, benchmarks, and tooling must be authored in C# (.cs) executed via dotnet run.
      - name: Enforce No Python Files Policy (Excluding PyArrow Test Data Generator)
        run: |
          echo "Scanning repository for forbidden Python (.py) files..."
          forbidden_py=$(git ls-files '*.py' | grep -v '^scripts/generate_test_data\.py$' || true)
          if [ -n "$forbidden_py" ]; then
            echo "::error::Unauthorized Python (.py) files found in repository:"
            echo "$forbidden_py"
            echo "All new scripts, benchmarks, and tooling must be authored in C# (.cs)."
            exit 1
          fi
          echo "Policy verified: Only authorized test data generator found."

      - name: Verify No Python Files in PR Diff
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          echo "Checking PR diff for forbidden Python (.py) files..."
          git fetch origin "$BASE_REF" --depth=1
          new_py=$(git diff --name-only --diff-filter=ACMR "origin/$BASE_REF...HEAD" | grep -E '\.py$' | grep -v '^scripts/generate_test_data\.py$' || true)
          if [ -n "$new_py" ]; then
            echo "::error::Pull request introduces forbidden Python (.py) files:"
            echo "$new_py"
            echo "Python files cannot be added to the repository. Author scripts in C# (.cs) instead."
            exit 1
          fi
          echo "PR diff check passed: zero unauthorized Python files introduced."

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Verify Benchmark Data LFS Hydration & Provenance Integrity
        run: dotnet run scripts/VerifyProvenance.cs

      - name: Verify Changelog Structure
        run: dotnet run scripts/ParseChangelog.cs

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # Exact version: the action otherwise installs the latest uv on every run.
          version: "0.12.21"

      - name: Restore solution dependencies
        run: dotnet restore Parquet.SourceGenerator.slnx --locked-mode

      - name: Audit Package Security & Vulnerabilities
        run: |
          audit_output=$(dotnet list package --vulnerable --include-transitive)
          echo "$audit_output"
          if echo "$audit_output" | grep -qi 'has the following vulnerable packages'; then
            echo "::error::Vulnerable packages detected in solution dependencies!"
            exit 1
          fi

      # CSharpier is the ONLY C# layout formatter in this repo. `dotnet format whitespace` was
      # retired from CI: its Roslyn formatter disagrees with CSharpier on layout (case-body and
      # pattern-arm indentation, per dotnet/format#2262) and in workspace mode it policed nothing
      # beyond .cs anyway. IDE0055 is disabled in .editorconfig so no Roslyn-based formatter —
      # build, IDE, or CLI — fights CSharpier over .cs layout. Line endings for non-C# files are
      # guaranteed by .gitattributes (eol=lf) plus the [*] hygiene keys in .editorconfig.
      #
      # Do not reintroduce plain `dotnet format` either: its style/analyzer phases build a Roslyn
      # workspace via MSBuildWorkspace, which does not execute source generators — it reports
      # bogus CS1503 against every call into the generated *ParquetExtensions API. Non-layout
      # style rules are enforced by the build below, via EnforceCodeStyleInBuild plus
      # -warnaserror, which uses the real compilation where generators do run.
      - name: Restore local tools
        run: |
          # Workaround for dotnet/sdk #53783: cold tool-resolver cache can misattribute package commands on initial restore
          dotnet tool restore --disable-parallel || dotnet tool restore --disable-parallel

      - name: Verify C# Code Formatting (CSharpier)
        run: dotnet csharpier check .

      # The CI half of the API change contract (docs/18-API-CHANGE-CONTRACT.md). Build errors
      # RS0016 and PARQAPI002 enforce "nothing exists outside a catalogue"; this enforces the
      # other half — "nothing is catalogued without a recorded semver decision" — which needs the
      # diff against the pull request's base and so cannot live in an analyzer. It also rejects the
      # `**Unapproved-by-design:**` escape-hatch marker, which suppresses those build errors for a
      # spike and must never reach main.
      - name: Verify API Change Ledger
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
          # Push to main has no base ref; the pushed range stands in for it (#430).
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: dotnet run scripts/CheckApiLedger.cs

      - name: Build solution (Release)
        run: dotnet build Parquet.SourceGenerator.slnx --configuration Release --no-restore -warnaserror

      # README.md and PACKAGE_README.md examples are compiled against the generator as a consumer
      # references it (#596, 47 section 8: README examples use only the stable surface). The
      # generator is already built above; this builds a snippet project from the tagged blocks and
      # fails with the README line of any example that uses a removed or renamed member.
      - name: Verify README Examples Compile
        run: dotnet run scripts/CheckReadme.cs

      # #259: accepted property kinds and nesting shapes are derived from the parser and backend
      # dials, then checked against the committed evidence map. A source change cannot silently
      # widen the coverage envelope without adding evidence and reviewing its risk.
      - name: Verify Coverage Envelope Map
        run: dotnet run scripts/CoverageMap.cs

      # The shared action keeps the committed-byte hash gate ahead of generation and sends all
      # generated compatibility data to RUNNER_TEMP. Its structure is covered by a consistency test.
      - name: Verify and Generate Test Data
        uses: ./.github/actions/verify-test-data

      - name: Generate C# PyArrow Interop Output
        env:
          PARQUET_PYARROW_INTEROP_OUTPUT: ${{ runner.temp }}/parquet-source-generator/generated-csharp.parquet
        run: dotnet run --project test/Parquet.SourceGenerator.CLI/Parquet.SourceGenerator.CLI.csproj -- --pyarrow-output "$PARQUET_PYARROW_INTEROP_OUTPUT"

      - name: Verify Generated Output With PyArrow
        env:
          PARQUET_PYARROW_INTEROP_OUTPUT: ${{ runner.temp }}/parquet-source-generator/generated-csharp.parquet
        run: uv run scripts/generate_test_data.py --verify-generated "$PARQUET_PYARROW_INTEROP_OUTPUT"

      - name: Install DuckDB CLI
        env:
          DUCKDB_VERSION: 1.5.4
          # SHA-256 of duckdb_cli-linux-amd64.zip for the version above (matches the digest GitHub
          # publishes for the release asset). Bump both together.
          DUCKDB_SHA256: 1f2fa724fb054b3dbe1a9cbd13de5b76997d850e7087ec762ba88db04e0180cf
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/duckdb"
          curl --fail --silent --show-error --location \
            "https://github.com/duckdb/duckdb/releases/download/v${DUCKDB_VERSION}/duckdb_cli-linux-amd64.zip" \
            --output "$RUNNER_TEMP/duckdb/duckdb.zip"
          echo "${DUCKDB_SHA256}  $RUNNER_TEMP/duckdb/duckdb.zip" | sha256sum --check --strict -
          unzip -oq "$RUNNER_TEMP/duckdb/duckdb.zip" -d "$RUNNER_TEMP/duckdb"
          chmod +x "$RUNNER_TEMP/duckdb/duckdb"
          echo "DUCKDB_BIN=$RUNNER_TEMP/duckdb/duckdb" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/duckdb/duckdb" --version

      - name: Verify Generated Output With DuckDB
        run: |
          dotnet run scripts/VerifyDuckDbInterop.cs -- \
            --duckdb "$DUCKDB_BIN" \
            --generated "$RUNNER_TEMP/parquet-source-generator/generated-csharp.parquet" \
            --output "$RUNNER_TEMP/parquet-source-generator/generated-duckdb.parquet"

      # Apache conformance (#167): independent file-format validation of every generated and
      # checked-in fixture with the pinned parquet-cli in test/data/apache-conformance.json.
      # Temurin 17 is part of the pin: the tool rides on Hadoop's UserGroupInformation, which
      # newer JDKs refuse. Every SHA-256 is re-verified from the manifest before use, and all
      # tool dumps plus the source and corrupt files are uploaded when this gate fails.
      - name: Setup Java (Apache Parquet conformance tooling)
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore Apache Parquet Conformance Tooling
        run: dotnet run scripts/VerifyApacheConformance.cs -- --restore "$RUNNER_TEMP/apache-parquet-tools"

      - name: Verify Apache Parquet Conformance
        run: |
          dotnet run scripts/VerifyApacheConformance.cs -- \
            --tools-dir "$RUNNER_TEMP/apache-parquet-tools" \
            --generated "$RUNNER_TEMP/parquet-source-generator/generated-csharp.parquet" \
            --output-dir "$RUNNER_TEMP/apache-conformance"

      - name: Upload Apache Conformance Evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: apache-conformance-evidence
          path: ${{ runner.temp }}/apache-conformance/

      - name: Interrogate IL & Verify Zero Boxing Regression Gate
        run: dotnet run scripts/InterrogateIL.cs --assembly test/Parquet.SourceGenerator.CLI/bin/Release/net8.0/Parquet.SourceGenerator.CLI.dll --check

      - name: Run Full Test Suite with Code Coverage Collection
        env:
          PARQUET_TEST_DATA_ROOT: ${{ runner.temp }}/parquet-source-generator/data
          PARQUET_TEST_DATA_CSHARP_ROOT: ${{ runner.temp }}/parquet-source-generator/data_csharp
          # The version/schema-evolution matrix writes its per-cell record here so the run leaves
          # behind a compatibility report, not just a pass/fail.
          PARQUET_COMPAT_MATRIX_OUTPUT: ${{ runner.temp }}/parquet-source-generator/compatibility-matrix
        run: dotnet test Parquet.SourceGenerator.slnx --configuration Release --no-build --filter "Category!=DatasetIntegrity&Category!=ExternalInterop" --verbosity normal --collect:"XPlat Code Coverage" --settings coverlet.runsettings --logger "trx;LogFileName=ci-core.trx"

      - name: Verify Generated Reader With PyArrow Fixture
        env:
          PARQUET_PYARROW_INTEROP_INPUT: ${{ runner.temp }}/parquet-source-generator/data/pyarrow_interop_input.parquet
          DUCKDB_INTEROP_INPUT: ${{ runner.temp }}/parquet-source-generator/generated-duckdb.parquet
        run: dotnet test Parquet.SourceGenerator.slnx --configuration Release --no-build --filter "Category=ExternalInterop" --verbosity normal --logger "trx;LogFileName=ci-external.trx"

      - name: Verify Required Test Execution
        run: dotnet run scripts/VerifyRequiredTestExecution.cs

      - name: Generate Code Coverage Summary & Evaluate Gate
        run: |
          dotnet run scripts/CoverageSummary.cs -- --output-markdown coverage-summary.md --min-line 85.0 --min-branch 70.0
          cat coverage-summary.md >> $GITHUB_STEP_SUMMARY

      - name: Post or Update Code Coverage PR Sticky Comment
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          marker="<!-- parquet-code-coverage-report -->"
          comment_id=$(gh api "repos/$REPO/issues/${PR_NUMBER}/comments" \
            --jq ".[] | select(.body | contains(\"$marker\")) | .id" | head -n 1)

          if [ -n "$comment_id" ]; then
            echo "Updating existing PR coverage comment ($comment_id)..."
            gh api -X PATCH "repos/$REPO/issues/comments/$comment_id" -F body=@coverage-summary.md
          else
            echo "Posting new PR coverage comment..."
            gh pr comment "$PR_NUMBER" --repo "$REPO" --body-file coverage-summary.md
          fi

      - name: Execute Sample (CoreCLR)
        run: dotnet run --project samples/Parquet.SourceGenerator.SampleAot/Parquet.SourceGenerator.SampleAot.csproj --configuration Release

      # The step above does NOT verify Native AOT: `dotnet run` executes under CoreCLR and ignores
      # PublishAot entirely, so the pipeline claimed an AOT guarantee it never tested. This is the
      # real thing — `publish -r` invokes the ILCompiler, which fails the build on trim/AOT
      # violations, and then the produced binary is executed with no runtime installed for it to
      # fall back to.
      #
      # AotTest is the right project to do it with: it round-trips through the generated serializer
      # and throws on mismatch, so a native binary exiting 0 is a genuine end-to-end result. It has
      # existed since the beginning and no workflow ever invoked it.
      - name: Verify Native AOT (publish + run native binary)
        run: |
          set -euo pipefail
          dotnet publish test/Parquet.SourceGenerator.AotTest/Parquet.SourceGenerator.AotTest.csproj \
            --configuration Release -r linux-x64 -o ./aot-out 2>&1 | tee aot-publish.log

          test -x ./aot-out/Parquet.SourceGenerator.AotTest \
            || { echo "FAIL: no native executable produced"; ls -la ./aot-out; exit 1; }

          echo "::group::trim / AOT-analysis warnings reported during publish"
          grep -E 'warning IL[0-9]+' aot-publish.log || echo "(none)"
          echo "::endgroup::"

          # Parquet.Net is not AOT-clean and we cannot fix that from here, so warnings attributed to
          # Parquet.dll are tolerated. Warnings attributed to anything else mean this repository's
          # own code — or the code it generates — has started depending on reflection or on metadata
          # the trimmer will remove. That is a regression, and it is invisible without this check
          # because IL warnings do not fail a build.
          if grep -E 'warning IL[0-9]+' aot-publish.log | grep -v '/Parquet\.dll ' | grep -q .; then
            echo "FAIL: trim/AOT warnings not attributable to Parquet.Net:"
            grep -E 'warning IL[0-9]+' aot-publish.log | grep -v '/Parquet\.dll '
            exit 1
          fi

          # A native image has no .dll of the same name beside it to be run by the shared runtime;
          # invoking the file directly is what proves this is the compiled binary and not an
          # apphost shim. The matrix inside covers every property kind, every read/write entry
          # point and every compression codec, because AOT reflection failures surface at runtime
          # rather than at compile time.
          ./aot-out/Parquet.SourceGenerator.AotTest

      - name: Pack All NuGet Packages
        run: dotnet pack Parquet.SourceGenerator.slnx --configuration Release --no-build --output ./artifacts

      # Packing proves the packages build, not that they work. These steps consume them.
      - name: Verify Package Layout
        uses: ./.github/actions/verify-package-layout

      - name: Verify Package Consumption (v6 & Legacy packages on .NET 8 & .NET 9)
        run: |
          set -euo pipefail
          version=$(ls artifacts/Parquet.SourceGenerator.[0-9]*.nupkg \
            | sed -E 's/.*Parquet\.SourceGenerator\.([0-9][^/]*)\.nupkg/\1/')
          echo "Consuming Parquet.SourceGenerator $version and Legacy from local feed"
          dotnet run --project test/PackageConsumption/PackageConsumption.csproj \
            --framework net8.0 \
            --configuration Release \
            -p:GeneratorPackageVersion="$version" \
            -p:RestorePackagesPath="$RUNNER_TEMP/consumption-packages-net8"

          dotnet run --project test/PackageConsumption/PackageConsumption.csproj \
            --framework net9.0 \
            --configuration Release \
            -p:GeneratorPackageVersion="$version" \
            -p:RestorePackagesPath="$RUNNER_TEMP/consumption-packages-net9"

          dotnet run --project test/PackageConsumptionLegacy/PackageConsumptionLegacy.csproj \
            --framework net8.0 \
            --configuration Release \
            -p:GeneratorPackageVersion="$version" \
            -p:RestorePackagesPath="$RUNNER_TEMP/consumption-packages-legacy-net8"

          dotnet run --project test/PackageConsumptionLegacy/PackageConsumptionLegacy.csproj \
            --framework net9.0 \
            --configuration Release \
            -p:GeneratorPackageVersion="$version" \
            -p:RestorePackagesPath="$RUNNER_TEMP/consumption-packages-legacy-net9"

      # Neither in-solution tests nor the two steps above can cover the version axis of the
      # compatibility matrix: a test assembly references exactly one Parquet.Net, so nothing inside
      # it can prove that a file written against 6.x is readable by a consumer pinned to 4.25. These
      # two projects each reference a different Parquet.Net and compile the same shared model
      # (test/CrossVersionInterop/InteropModels.cs), so handing a file from one to the other is the
      # only place that leg gets exercised. The reader model is deliberately one version ahead of
      # the writer's — reordered columns plus two optional columns the file cannot contain — so the
      # handshake tests schema evolution across the version boundary rather than a bare round-trip.
      - name: Verify Cross-Version Interoperability (modern ⇄ legacy packages)
        run: |
          set -euo pipefail
          version=$(ls artifacts/Parquet.SourceGenerator.[0-9]*.nupkg \
            | sed -E 's/.*Parquet\.SourceGenerator\.([0-9][^/]*)\.nupkg/\1/')
          interop="$RUNNER_TEMP/parquet-source-generator/cross-version"
          matrix="$RUNNER_TEMP/parquet-source-generator/compatibility-matrix/cross-version.jsonl"
          mkdir -p "$interop" "$(dirname "$matrix")"

          modern=(dotnet run --project test/PackageConsumption/PackageConsumption.csproj
            --framework net8.0 --configuration Release
            -p:GeneratorPackageVersion="$version"
            -p:RestorePackagesPath="$RUNNER_TEMP/consumption-packages-net8")
          legacy=(dotnet run --project test/PackageConsumptionLegacy/PackageConsumptionLegacy.csproj
            --framework net8.0 --configuration Release
            -p:GeneratorPackageVersion="$version"
            -p:RestorePackagesPath="$RUNNER_TEMP/consumption-packages-legacy-net8")

          "${modern[@]}" -- --write-interop "$interop/modern.parquet"
          "${legacy[@]}" -- --read-interop "$interop/modern.parquet" modern/Parquet.Net-6.x "$matrix"

          "${legacy[@]}" -- --write-interop "$interop/legacy.parquet"
          "${modern[@]}" -- --read-interop "$interop/legacy.parquet" classic/Parquet.Net-4.25 "$matrix"

          echo "::group::cross-version matrix rows"; cat "$matrix"; echo "::endgroup::"

      # .NET Framework support is the entire reason the Legacy package exists, and until now nothing in
      # CI compiled it — the project declared net472 but every step above pins --framework to a
      # modern TFM, so the target was never built. Compiling is as far as a Linux runner can go
      # (executing net472 needs Windows or Mono), but it is what catches the failures that actually
      # occur here: generated code using a language feature net472's default LangVersion rejects, or
      # an API that only exists on .NET 6+.
      - name: Verify Legacy Package Consumption Compiles on .NET Framework 4.7.2
        run: |
          set -euo pipefail
          version=$(ls artifacts/Parquet.SourceGenerator.[0-9]*.nupkg \
            | sed -E 's/.*Parquet\.SourceGenerator\.([0-9][^/]*)\.nupkg/\1/')
          dotnet build test/PackageConsumptionLegacy/PackageConsumptionLegacy.csproj \
            --framework net472 \
            --configuration Release \
            -p:GeneratorPackageVersion="$version" \
            -p:RestorePackagesPath="$RUNNER_TEMP/consumption-packages-legacy-net472"

      - name: Upload Compatibility Matrix Report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: compatibility-matrix
          path: ${{ runner.temp }}/parquet-source-generator/compatibility-matrix
          if-no-files-found: warn

      - name: Upload Test Coverage Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: code-coverage
          path: test/Parquet.SourceGenerator.Tests/TestResults/*/coverage.cobertura.xml

      - name: Upload Build & Package Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nuget-packages
          path: ./artifacts/*.nupkg

  # Derived review outputs (docs/17-GENERATED-API-BASELINES.md). The emitted source of each golden
  # model, its signature-only public API, code metrics (src/ and generated), duplication and the
  # call graph are generated from the code here and never checked in; every run uploads them as the
  # `derived-outputs` artifact. On a push to main the same tree is also kept as
  # `derived-baseline-<sha>`. On a pull request the merge base's tree is fetched from that artifact
  # (or regenerated when it is missing), diffed against the head, and posted as ONE sticky comment,
  # API changes first. Runs beside `test` rather than inside it, so it adds no wall-clock time;
  # `build` below requires both.
  #
  # The gates that remain live here, on the head: golden models parse and compile, emitted code
  # compiles against its GoldenModels/ declaration (ERRORS=0), CodeMetricsConfig.txt is valid
  # (a malformed entry silently disables CA1502/CA1505/CA1506), and the call graph satisfies its
  # cycle, fan-out and layering rules (docs/25-CALL-GRAPH.md). Nothing about the merge base can
  # fail this job: the base already passed its own gates on its branch.
  #
  # NU1903 warnings on Microsoft.Build.Tasks.Core and Snappier from `dotnet run
  # scripts/CodeMetrics.cs` are expected: transitive dependencies of Workspaces.MSBuild and of the
  # Parquet.Net 4.25.0 pin the legacy golden model is measured against; neither executes here and
  # both are outside the solution the audit step governs.
  derived:
    name: derived
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Find and download the merge base's `derived-baseline-<sha>` artifact from its main run.
      actions: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The merge base must be reachable, to name it and, when its baseline is missing, to
          # regenerate its side of the diff.
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore dependencies
        run: dotnet restore Parquet.SourceGenerator.slnx --locked-mode

      # Named first, so the PR summary (read from git) is there even when producing the head's
      # derived outputs fails.
      - name: Name Merge Base
        id: mb
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          base=$(git merge-base "origin/$BASE_REF" HEAD)
          echo "sha=$base" >> "$GITHUB_OUTPUT"
          echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "label=$BASE_REF @ ${base:0:7}" >> "$GITHUB_OUTPUT"

      - name: Produce Derived Outputs (head)
        id: head
        run: |
          dotnet run scripts/DerivedOutputs.cs -- --out "$RUNNER_TEMP/derived/head"
          for f in code-metrics.md duplication.md callgraph/callgraph-summary.md; do
            cat "$RUNNER_TEMP/derived/head/$f" >> "$GITHUB_STEP_SUMMARY"
            echo >> "$GITHUB_STEP_SUMMARY"
          done

      # The baseline for every commit on main, named by its SHA so a pull request can fetch exactly
      # its merge base's outputs instead of rebuilding them. Only a head that passed its gates is
      # published; a missing baseline (a failed or expired run) is regenerated by the consumer.
      - name: Publish Main Baseline
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: derived-baseline-${{ github.sha }}
          path: ${{ runner.temp }}/derived/head/
          retention-days: 90
          if-no-files-found: error

      # The merge base's outputs. Fetched from the main run that published them; regenerated here
      # in a worktree only when there is no such artifact — the base is another branch of a stack,
      # its main run has not finished yet, or the artifact expired (90 days). Outputs are
      # byte-identical across runs and runners, so a fetched baseline equals a regenerated one.
      # Best effort: a failure here is reported in the comment, never as a failed check.
      - name: Resolve Merge Base Outputs
        id: base
        if: github.event_name == 'pull_request' && steps.head.outcome == 'success'
        continue-on-error: true
        env:
          BASE: ${{ steps.mb.outputs.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/derived/base"
          name="derived-baseline-$BASE"
          # The name alone proves nothing: any workflow run — a pull request that edits this file,
          # a fork's run — can upload an artifact called derived-baseline-<sha>. Accept only one
          # uploaded from this repository by a push run of ci.yml on main, at exactly this commit.
          candidates=$(gh api --paginate "repos/$REPO/actions/artifacts?name=$name" --jq ".artifacts[]
            | select((.expired | not)
                and .workflow_run.head_sha == \"$BASE\"
                and .workflow_run.head_branch == \"main\"
                and .workflow_run.head_repository_id == .workflow_run.repository_id)
            | .workflow_run.id" || true)
          run_id=""
          for candidate in $candidates; do
            origin=$(gh api "repos/$REPO/actions/runs/$candidate" --jq '"\(.event) \(.path)"' || true)
            if [ "$origin" = "push .github/workflows/ci.yml" ]; then
              run_id=$candidate
              break
            fi
            echo "Ignoring $name from run $candidate ($origin): not a push run of ci.yml."
          done
          if [ -n "$run_id" ] && gh run download "$run_id" --repo "$REPO" --name "$name" --dir "$out"; then
            echo "source=\`$name\` from run $run_id" >> "$GITHUB_OUTPUT"
          else
            echo "No usable $name artifact; regenerating the merge base's outputs."
            rm -rf "$out"
            git worktree add "$RUNNER_TEMP/base-tree" "$BASE"
            dotnet run scripts/DerivedOutputs.cs -- --repo "$RUNNER_TEMP/base-tree" --out "$out"
            echo "source=regenerated in this run (no \`$name\` artifact)" >> "$GITHUB_OUTPUT"
          fi

      # The two HTML views (scripts/DerivedReport): the diff against the merge base, and the head's
      # state as it is. Each is written only when there is something to show.
      - name: Render Reports
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        env:
          HEAD_STATUS: ${{ steps.head.outcome }}
          BASE_STATUS: ${{ steps.base.outcome }}
          BASE_LABEL: ${{ steps.mb.outputs.label }}
          BASE_SOURCE: ${{ steps.base.outputs.source }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          report=scripts/DerivedReport/DerivedReport.cs
          if [ "$HEAD_STATUS" = success ]; then
            dotnet run "$report" -- state --tree "$RUNNER_TEMP/derived/head" \
              --label "PR #$PR_NUMBER head" --html "$RUNNER_TEMP/derived-state.html"
          fi
          if [ "$HEAD_STATUS" = success ] && [ "$BASE_STATUS" = success ]; then
            dotnet run "$report" -- diff --base "$RUNNER_TEMP/derived/base" \
              --head "$RUNNER_TEMP/derived/head" --base-label "$BASE_LABEL" \
              --base-source "$BASE_SOURCE" --repo . \
              --base-commit "${{ steps.mb.outputs.sha }}" --head-commit "${{ steps.mb.outputs.head }}" \
              --patch "$RUNNER_TEMP/derived/review.patch" --html "$RUNNER_TEMP/derived-diff.html"
          fi

      # Each uploaded unzipped (archive: false, which names the artifact after the file), so the
      # comment's links download the pages themselves rather than zips.
      - name: Upload Diff (HTML)
        id: diff_html
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          path: ${{ runner.temp }}/derived-diff.html
          archive: false
          if-no-files-found: ignore

      - name: Upload State (HTML)
        id: state_html
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          path: ${{ runner.temp }}/derived-state.html
          archive: false
          if-no-files-found: ignore

      # The PR summary. Rendered on every run, so the comment always describes this one: a diff,
      # or a statement that the head failed or the base could not be produced.
      - name: Render Review Comment
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        env:
          HEAD_STATUS: ${{ steps.head.outcome }}
          BASE_STATUS: ${{ steps.base.outcome }}
          BASE_LABEL: ${{ steps.mb.outputs.label || github.base_ref }}
          BASE_SOURCE: ${{ steps.base.outputs.source }}
          DIFF_URL: ${{ steps.diff_html.outputs.artifact-url }}
          STATE_URL: ${{ steps.state_html.outputs.artifact-url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir -p "$RUNNER_TEMP/derived"
          dotnet run scripts/DerivedReport/DerivedReport.cs -- diff \
            --base "$RUNNER_TEMP/derived/base" --head "$RUNNER_TEMP/derived/head" \
            --base-label "$BASE_LABEL" --base-source "$BASE_SOURCE" --repo . \
            --base-commit "${{ steps.mb.outputs.sha }}" --head-commit "${{ steps.mb.outputs.head }}" \
            --head-status "${HEAD_STATUS:-skipped}" --base-status "${BASE_STATUS:-skipped}" \
            --diff-url "$DIFF_URL" --state-url "$STATE_URL" --artifact-url "$RUN_URL#artifacts" \
            --comment "$RUNNER_TEMP/derived/review-diff.md"
          cat "$RUNNER_TEMP/derived/review-diff.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Derived Outputs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: derived-outputs
          path: ${{ runner.temp }}/derived/
          if-no-files-found: warn

      # One comment per pull request, edited in place on every run, found by its marker. If the
      # renderer itself failed, a minimal body still replaces the previous run's diff. A fork's
      # token cannot write comments; the result is still in the step summary and the artifact, so
      # that is not a failure.
      - name: Update Sticky Review Comment
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # A re-run keeps its original event, so an old run re-run after a newer push would
          # otherwise replace the current head's diff with its own. Only the current head posts.
          current=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq .head.sha)
          if [ "$current" != "$HEAD_SHA" ]; then
            echo "The PR head is now ${current:0:7}; this run is for ${HEAD_SHA:0:7}. Leaving the comment alone."
            exit 0
          fi
          body="$RUNNER_TEMP/derived/review-diff.md"
          if [ ! -s "$body" ]; then
            mkdir -p "$(dirname "$body")"
            printf '%s\n## Derived output: not rendered\n\nThe `derived` job failed before it could render a diff. See [the run](%s).\n' \
              '<!-- derived-review-diff -->' "$RUN_URL" > "$body"
          fi
          id=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- derived-review-diff -->"))) | .id' \
            | head -n 1)
          if [ -n "$id" ]; then
            gh api --method PATCH "repos/$REPO/issues/comments/$id" -F "body=@$body" > /dev/null
          else
            gh pr comment "$PR_NUMBER" --repo "$REPO" --body-file "$body"
          fi

  # Every analyzer the shipped src/ projects run, run over the golden models' emitted source
  # (docs/50-GENERATED-CODE-ANALYSIS.md). Any finding fails the job, and so the required `build`
  # check: the baseline is empty and there is no list to add a rule to. Kept apart from `derived`
  # so a red result names the rule and count, and so it gates without needing a base to diff.
  #
  # Two things keep it from passing by examining nothing. The script fails when the emitted files
  # it compiled do not match the golden models declared in test/.../GoldenModels, or when either
  # backend compiled none; and the positive control below runs the same pipeline over a seeded
  # violation and fails unless the gate catches it in both backends (compare the zero-boxing IL
  # gate, #467, and the coverage gate, #416).
  generated-analysis:
    name: generated-analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      # Publishes each golden model's emitted source to artifacts/golden/ (gitignored).
      - name: Publish golden outputs
        run: >-
          dotnet test test/Parquet.SourceGenerator.Tests/Parquet.SourceGenerator.Tests.csproj
          --configuration Release --filter "FullyQualifiedName~GoldenCodeGenRegressionTests"

      # Positive control: a seeded CA2007 violation in each backend must fail the gate.
      - name: Positive control (a seeded violation must fail the gate)
        run: dotnet run scripts/GeneratedCodeAnalysis.cs -- --self-test

      # The summary is written even when the gate fails, so a red run still shows its table.
      - name: Analyze emitted code
        run: |
          dotnet run scripts/GeneratedCodeAnalysis.cs -- --summary "$RUNNER_TEMP/generated-analysis.md"

      - name: Publish analysis summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/generated-analysis.md" ]; then
            cat "$RUNNER_TEMP/generated-analysis.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload generated-diagnostics.txt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: generated-diagnostics
          path: artifacts/analysis/generated-diagnostics.txt
          if-no-files-found: error

  # The required status check. The job name is the check name that branch protection matches on
  # (.github/BRANCH_PROTECTION.md, REPO_REQUIRED_CHECKS_MAP in shared-utilities), so it is
  # deliberately short, lowercase, and free of characters that are easy to mistype or that GitHub
  # HTML-escapes. Treat it as an identifier: renaming it silently breaks the ruleset. It exists so
  # the gates in `derived` (emitted code compiles, call-graph rules, CodeMetricsConfig.txt) and
  # `generated-analysis` (analyzer findings in emitted code) block a merge exactly as the ones in
  # `test` do, while the jobs still run in parallel.
  # The Legacy package exists for .NET Framework. The compile-only net472 step in `test` proves it
  # builds and nothing about running it (#565); this job executes the consumer on a real .NET
  # Framework runtime (windows-latest): write, read, compression, batching and schema evolution
  # scenarios, the blocked-SynchronizationContext round trip, and a file hand-off with net8.0 in both
  # directions. It is part of the `build` aggregate and has no path filter, so a change outside src/
  # cannot skip it and then leave a required check satisfied by absence. It builds its own two
  # packages because artifacts do not cross jobs without extra steps.
  net472-consumer:
    name: net472-consumer
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Pack the Attributes and Legacy packages
        run: |
          set -euo pipefail
          dotnet pack src/Parquet.SourceGenerator.Attributes/Parquet.SourceGenerator.Attributes.csproj \
            --configuration Release --output artifacts -p:Version=0.0.0-net472.1
          dotnet pack src/Parquet.SourceGenerator.Legacy/Parquet.SourceGenerator.Legacy.csproj \
            --configuration Release --output artifacts -p:Version=0.0.0-net472.1
          ls artifacts

      # Executed, not compiled: `dotnet run` starts the net472 executable on the .NET Framework
      # runtime of the runner. A missing method, binding redirect or System.Memory version skew
      # fails here and passed ci.yml's compile-only step.
      - name: Run the Legacy consumer on .NET Framework 4.7.2
        run: |
          set -euo pipefail
          dotnet run --project test/PackageConsumptionLegacy/PackageConsumptionLegacy.csproj \
            --framework net472 --configuration Release \
            -p:GeneratorPackageVersion=0.0.0-net472.1 \
            -p:RestorePackagesPath="$RUNNER_TEMP/consumption-packages-legacy-net472"

      # The same file format has to cross runtimes: written by .NET Framework and read on .NET 8,
      # and the reverse. Each leg prints the producer so a mislabelled run is visible.
      - name: Hand a file between .NET Framework 4.7.2 and .NET 8
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/net472-interop"
          mkdir -p "$dir"
          project=test/PackageConsumptionLegacy/PackageConsumptionLegacy.csproj
          net472=(dotnet run --project "$project" --framework net472 --configuration Release
            -p:GeneratorPackageVersion=0.0.0-net472.1
            -p:RestorePackagesPath="$RUNNER_TEMP/consumption-packages-legacy-net472")
          net8=(dotnet run --project "$project" --framework net8.0 --configuration Release
            -p:GeneratorPackageVersion=0.0.0-net472.1
            -p:RestorePackagesPath="$RUNNER_TEMP/consumption-packages-legacy-net8")

          "${net472[@]}" -- --write-interop "$dir/net472.parquet"
          "${net8[@]}" -- --read-interop "$dir/net472.parquet" classic/net472
          "${net8[@]}" -- --write-interop "$dir/net8.parquet"
          "${net472[@]}" -- --read-interop "$dir/net8.parquet" classic/net8.0

  build:
    name: build
    if: always()
    needs: [test, derived, generated-analysis, net472-consumer]
    runs-on: ubuntu-latest
    steps:
      - name: Require test, derived, generated-analysis and net472-consumer
        env:
          TEST_RESULT: ${{ needs.test.result }}
          DERIVED_RESULT: ${{ needs.derived.result }}
          ANALYSIS_RESULT: ${{ needs.generated-analysis.result }}
          NET472_RESULT: ${{ needs.net472-consumer.result }}
        run: |
          echo "test: $TEST_RESULT, derived: $DERIVED_RESULT, generated-analysis: $ANALYSIS_RESULT, net472-consumer: $NET472_RESULT"
          if [ "$TEST_RESULT" != "success" ] || [ "$DERIVED_RESULT" != "success" ] || [ "$ANALYSIS_RESULT" != "success" ] || [ "$NET472_RESULT" != "success" ]; then
            echo "::error::Required jobs did not all succeed (test=$TEST_RESULT, derived=$DERIVED_RESULT, generated-analysis=$ANALYSIS_RESULT, net472-consumer=$NET472_RESULT)."
            exit 1
          fi
