name: Semgrep OSS Security Scan

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  semgrep:
    name: semgrep-oss
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run Semgrep OSS
        run: |
          docker run --rm -v "${{ github.workspace }}:/src" returntocorp/semgrep@sha256:acaac22ffc7b7cc5926de0751b223bce0b2491c33d18422fa72f632c78d81198 semgrep scan \
            --config "p/csharp" \
            --config "p/owasp-top-ten" \
            --sarif --output semgrep.sarif src/

      - name: Upload Semgrep SARIF Report
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        if: always()
        with:
          sarif_file: semgrep.sarif
