name: Mutation Testing (nightly)

# #261, layer 4 of #251: does a mutated line of the generator still get caught by a
# failing TEST, or only by a text diff? Coverage says a line executed; mutation testing
# says a test would have noticed if the line were wrong — and per the issue, Stryker
# runs here with the snapshot-style suites (golden models, API rendering, IL
# shape) EXCLUDED, because those "kill" any mutation trivially and would report a
# flattering lie. The exclusion and its reasoning live in stryker-config.json and
# docs/26-MUTATION-TESTING.md; read them before touching the filter.
#
# Reporting follows #189's lesson: a scheduled job that merely fails gets muted, so
# this one never gates on the score. It maintains ONE PR (mutation/headline branch),
# refreshing its body nightly; humans merge or close, Stryker only informs. Thresholds
# are unset until the baseline number is established (issue AC: no floor picked in
# advance). Runs nightly, never per-PR: a full mutation sweep is far too slow for
# review feedback.

on:
  schedule:
    - cron: '30 4 * * *'
  workflow_dispatch:

# Read-only: the headline branch and PR are written with WORKFLOW_PR_TOKEN (see the refresh step),
# because GITHUB_TOKEN pushes and pull requests start no workflows (#568).
permissions:
  contents: read

concurrency:
  group: mutation-nightly
  cancel-in-progress: false

jobs:
  mutate:
    name: Stryker.NET over the behavioural suite
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Checkout would otherwise persist a GITHUB_TOKEN Authorization header that wins over the
          # token in the pr-bot remote below, making the push a GITHUB_TOKEN push that starts no
          # workflows (#568). Nothing else in this job needs git credentials.
          persist-credentials: false

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      # The same dotnet/sdk #53783 workaround ci.yml carries. A cold tool-resolver cache
      # misattributes a package's commands on the first restore ("The command dotnet-stryker ...
      # is not contained in the package ... The commands contained are dotnet-inspect") and exits
      # non-zero; the second restore succeeds. Without the retry this job failed at this step on
      # every nightly run, and since it only informs, nobody noticed (docs/51-CI-GATE-MATRIX.md).
      - name: Restore local tools
        run: dotnet tool restore --disable-parallel || dotnet tool restore --disable-parallel

      - name: Restore solution dependencies
        run: dotnet restore Parquet.SourceGenerator.slnx --locked-mode

      - name: Build (Release, no generators-in-the-way of test discovery)
        run: dotnet build Parquet.SourceGenerator.slnx --configuration Release --no-restore

      - name: Stryker — the generator (parser + emitters)
        run: |
          set -euo pipefail
          # A fresh runner has no StrykerOutput/: ls then exits non-zero and pipefail would carry that into
          # the assignment and kill the step before Stryker starts (#575). An empty list is correct.
          before=$(ls -1d StrykerOutput/*/ 2>/dev/null | sort || true)
          dotnet tool run dotnet-stryker -- \
            -p Parquet.SourceGenerator.csproj \
            --log-to-file
          after=$(ls -1d StrykerOutput/*/ 2>/dev/null | sort || true)
          newdir=$(comm -13 <(printf '%s\n' "$before") <(printf '%s\n' "$after") | head -1)
          if [ -z "$newdir" ]; then
            echo "::error::Stryker finished without creating a new StrykerOutput directory"
            exit 1
          fi
          echo "GENERATOR_REPORT=$newdir/reports/mutation-report.json" >> "$GITHUB_ENV"
        timeout-minutes: 100

      - name: Stryker — shipped runtime helpers (Attributes)
        run: |
          set -euo pipefail
          # A fresh runner has no StrykerOutput/: ls then exits non-zero and pipefail would carry that into
          # the assignment and kill the step before Stryker starts (#575). An empty list is correct.
          before=$(ls -1d StrykerOutput/*/ 2>/dev/null | sort || true)
          dotnet tool run dotnet-stryker -- \
            -p Parquet.SourceGenerator.Attributes.csproj \
            --log-to-file
          after=$(ls -1d StrykerOutput/*/ 2>/dev/null | sort || true)
          newdir=$(comm -13 <(printf '%s\n' "$before") <(printf '%s\n' "$after") | head -1)
          if [ -z "$newdir" ]; then
            echo "::error::Stryker finished without creating a new StrykerOutput directory"
            exit 1
          fi
          echo "ATTRIBUTES_REPORT=$newdir/reports/mutation-report.json" >> "$GITHUB_ENV"
        timeout-minutes: 45

      - name: Summarize reports
        run: |
          set -euo pipefail
          : > mutation-headline.md
          dotnet run scripts/MutationSummary.cs -- \
            --report "$ATTRIBUTES_REPORT" \
            --label "Parquet.SourceGenerator.Attributes (shipped helpers)" \
            --out mutation-headline.md --append
          dotnet run scripts/MutationSummary.cs -- \
            --report "$GENERATOR_REPORT" \
            --label "Parquet.SourceGenerator (parser + emitters)" \
            --out mutation-headline.md --append
          test -s mutation-headline.md

      # The headline PR is opened and refreshed with WORKFLOW_PR_TOKEN, a fine-grained personal access
      # token the owner creates (docs/51-CI-GATE-MATRIX.md, R11). A pull request opened with
      # GITHUB_TOKEN starts no workflows, so it never receives the required checks and can never
      # merge, and a later push to its branch with GITHUB_TOKEN starts none either (#568). Without
      # the secret this step does nothing but say so; the score is in the job summary and the
      # `mutation-headline` artifact.
      - name: Refresh the mutation headline PR
        env:
          PR_TOKEN: ${{ secrets.WORKFLOW_PR_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          cat mutation-headline.md >> "$GITHUB_STEP_SUMMARY"
          if [ -z "${PR_TOKEN:-}" ]; then
            msg="WORKFLOW_PR_TOKEN is not configured, so the mutation headline pull request was not refreshed. A pull request opened with GITHUB_TOKEN gets no required checks and cannot merge (#568). The score is in this run's summary and in the mutation-headline artifact. See docs/51-CI-GATE-MATRIX.md (R11) for the secret to create."
            echo "::notice title=Mutation headline PR not refreshed::$msg"
            echo "$msg" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          branch="mutation/headline"

          git remote add pr-bot "https://x-access-token:${PR_TOKEN}@github.com/${REPO}.git"

          # A push re-runs CI on the PR. When the score is the same as the one already on the branch
          # there is nothing to report, so do not spend a CI run on a new run link.
          git fetch --quiet pr-bot "$branch" 2>/dev/null || true
          if git cat-file -e "pr-bot/$branch:docs/MUTATION-HEADLINE.md" 2>/dev/null \
            && diff -q <(git show "pr-bot/$branch:docs/MUTATION-HEADLINE.md" | sed '1,/^_Updated nightly/d' | sed '/./,$!d') \
              <(sed '/./,$!d' mutation-headline.md) >/dev/null; then
            echo "::notice title=Mutation score unchanged::The score matches the one on $branch; not pushing, which would only re-run CI."
            exit 0
          fi

          mkdir -p docs
          {
            echo "# Mutation testing headline — latest nightly run"
            echo
            echo "Score computed over the behavioural suite only (snapshot-style tests"
            echo "excluded — see docs/26-MUTATION-TESTING.md before reading a number)."
            echo
            echo "_Updated nightly from the [mutation workflow]($RUN_URL)._"
            echo
            cat mutation-headline.md
          } > docs/MUTATION-HEADLINE.md
          git checkout -B "$branch"
          git add docs/MUTATION-HEADLINE.md
          git commit -m "chore(mutation): nightly mutation score refresh"
          git push -f -u pr-bot "$branch"
          export GH_TOKEN="$PR_TOKEN"
          existing=$(gh pr list --repo "$REPO" --head "$branch" --state open --json number --jq '.[0].number // empty')
          body="Nightly mutation score over the **behavioural suite only** — golden-file, API-baseline, metrics-baseline and IL-shape tests are deliberately excluded (they kill every mutation trivially; the score would be a flattering lie). Full reasoning: docs/26-MUTATION-TESTING.md. The floor is intentionally unset until this baseline is established (#261 AC); merge or close — this PR is a report, not a request."
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --repo "$REPO" --body "$body"
          else
            gh pr create --repo "$REPO" --base main --head "$branch" \
              --title "chore(mutation): nightly mutation testing baseline (#261)" \
              --body "$body"
          fi

      - name: Upload the mutation headline
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mutation-headline
          path: mutation-headline.md
          if-no-files-found: ignore

      - name: Upload raw Stryker reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: stryker-reports
          path: StrykerOutput/**/reports/*.json
          if-no-files-found: warn

  # A scheduled gate that only turns red is muted by its own history (#564: this workflow failed
  # unseen for weeks). When the job above fails, open one `area:ci` issue, or comment on the open
  # one. It is a separate job so the only job that runs repo code never holds `issues: write`,
  # and it needs no checkout. Same pattern as metrics-oracle.yml.
  notify-failure:
    name: Report scheduled failure
    needs: mutate
    if: ${{ always() && needs.mutate.result == 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update the failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="[CI] scheduled mutation failed"
          body="The scheduled mutation workflow failed: [run]($RUN_URL). Open the run for the failing step. This issue is updated with a comment on each further failure; close it once the workflow is green again."
          gh label create "area:ci" --color B60205 --description "CI and workflow gates" >/dev/null 2>&1 || true
          existing=$(gh issue list --state open --label "area:ci" --search "\"$title\" in:title" \
            --json number,title --jq "[.[] | select(.title == \"$title\")][0].number // empty")
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Failed again: [run]($RUN_URL)."
          else
            gh issue create --title "$title" --body "$body" --label "area:ci"
          fi
