name: Release & Publish NuGet

# CHANGELOG.md is the release authority: scripts/ParseChangelog.cs reads the version
# and release notes from the first cut version section (`## [x.y.z] - YYYY-MM-DD`).
# To release, merge a PR that moves [Unreleased] under such a heading, then dispatch
# this workflow. There is deliberately no version input — a version that is not
# described in the changelog cannot be published.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build, pack and verify only — no NuGet push, no GitHub release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve release from changelog
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.changelog.outputs.version }}
      tag: ${{ steps.changelog.outputs.tag }}
      is_prerelease: ${{ steps.changelog.outputs.is_prerelease }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.x'

      - name: Parse changelog (release mode)
        id: changelog
        run: |
          dotnet run scripts/ParseChangelog.cs --release \
            --notes-out "$RUNNER_TEMP/release-notes.md" \
            --github-output "$GITHUB_OUTPUT"

      - name: Refuse to re-release an existing tag
        env:
          TAG: ${{ steps.changelog.outputs.tag }}
        run: |
          set -euo pipefail
          if [ -n "$(git ls-remote --tags origin "refs/tags/$TAG")" ]; then
            echo "::error::Tag $TAG already exists on origin; '$TAG' is already released. Cut a new version section instead."
            exit 1
          fi
          echo "Tag $TAG is free."

      - name: Upload release notes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-info
          path: ${{ runner.temp }}/release-notes.md
          if-no-files-found: error

  build:
    name: Build & verify packages
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          lfs: true

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Verify Benchmark Data LFS Hydration & Provenance Integrity
        run: dotnet run scripts/VerifyProvenance.cs

      - name: Restore dependencies
        run: dotnet restore Parquet.SourceGenerator.slnx

      - name: Build Solution (Release)
        run: |
          dotnet build Parquet.SourceGenerator.slnx --configuration Release --no-restore \
            -warnaserror -p:Version=${{ needs.prepare.outputs.version }}

      # Dataset hash integrity gates the COMMITTED bytes, so it must run before any
      # generated compatibility dataset exists — and the generators below must write
      # to RUNNER_TEMP rather than over the checked-in fixtures. This mirrors ci.yml.
      # Regenerating in place rewrote test/data_csharp with output from the currently
      # pinned Parquet.Net, whose hashes do not match the manifest, which is why the
      # release job failed tests that ci.yml passed.
      - name: Verify Checked-In Dataset Hash Integrity (pre-regeneration)
        run: dotnet test Parquet.SourceGenerator.slnx --configuration Release --no-build --filter "Category=DatasetIntegrity" --verbosity normal

      - name: Generate Python Test Datasets (PyArrow v1 & v2)
        env:
          PARQUET_TEST_DATA_OUTPUT_DIR: ${{ runner.temp }}/parquet-source-generator/data
        run: uv run scripts/generate_test_data.py

      - name: Generate C# Test Datasets (Parquet.Net)
        env:
          PARQUET_TEST_DATA_CSHARP_OUTPUT_DIR: ${{ runner.temp }}/parquet-source-generator/data_csharp
        run: dotnet run --project test/Parquet.SourceGenerator.CLI/Parquet.SourceGenerator.CLI.csproj

      - name: Run Tests
        run: dotnet test Parquet.SourceGenerator.slnx --configuration Release --no-build

      - name: Execute Sample (CoreCLR)
        run: dotnet run --project samples/Parquet.SourceGenerator.SampleAot/Parquet.SourceGenerator.SampleAot.csproj --configuration Release

      - name: Verify Native AOT (publish + run native binary)
        run: |
          set -euo pipefail
          dotnet publish test/Parquet.SourceGenerator.AotTest/Parquet.SourceGenerator.AotTest.csproj \
            --configuration Release -r linux-x64 -o ./aot-out 2>&1 | tee aot-publish.log

          test -x ./aot-out/Parquet.SourceGenerator.AotTest \
            || { echo "FAIL: no native executable produced"; ls -la ./aot-out; exit 1; }

          echo "::group::trim / AOT-analysis warnings reported during publish"
          grep -E 'warning IL[0-9]+' aot-publish.log || echo "(none)"
          echo "::endgroup::"

          if grep -E 'warning IL[0-9]+' aot-publish.log | grep -v '/Parquet\.dll ' | grep -q .; then
            echo "FAIL: trim/AOT warnings not attributable to Parquet.Net:"
            grep -E 'warning IL[0-9]+' aot-publish.log | grep -v '/Parquet\.dll '
            exit 1
          fi

          ./aot-out/Parquet.SourceGenerator.AotTest

      - name: Pack All Packages
        run: |
          dotnet pack Parquet.SourceGenerator.slnx --configuration Release --no-build \
            --output ./artifacts -p:Version=${{ needs.prepare.outputs.version }}

      - name: Verify Package Layout
        run: |
          set -euo pipefail
          version="${{ needs.prepare.outputs.version }}"
          cd artifacts
          gen="Parquet.SourceGenerator.${version}.nupkg"
          genlegacy="Parquet.SourceGenerator.Legacy.${version}.nupkg"
          attrs="Parquet.SourceGenerator.Attributes.${version}.nupkg"

          test -f "$gen"       || { echo "FAIL: $gen not produced"; ls -la; exit 1; }
          test -f "$genlegacy" || { echo "FAIL: $genlegacy not produced"; ls -la; exit 1; }
          test -f "$attrs"     || { echo "FAIL: $attrs not produced"; ls -la; exit 1; }

          unzip -Z1 "$gen" | grep -q '^analyzers/dotnet/cs/Parquet\.SourceGenerator\.dll$' \
            || { echo "FAIL: generator missing from analyzers/dotnet/cs/"; exit 1; }
          unzip -Z1 "$genlegacy" | grep -q '^analyzers/dotnet/cs/Parquet\.SourceGenerator\.Legacy\.dll$' \
            || { echo "FAIL: Legacy generator missing from analyzers/dotnet/cs/"; exit 1; }
          if unzip -Z1 "$gen" | grep -q '^lib/' || unzip -Z1 "$genlegacy" | grep -q '^lib/'; then
            echo "FAIL: generator package contains lib/ entries; it must be analyzer-only:"
            exit 1
          fi
          unzip -p "$gen" '*.nuspec' | grep -q 'id="Parquet.SourceGenerator.Attributes"' \
            || { echo "FAIL: generator .nuspec does not depend on the Attributes package"; exit 1; }
          unzip -p "$genlegacy" '*.nuspec' | grep -q 'id="Parquet.SourceGenerator.Attributes"' \
            || { echo "FAIL: Legacy generator .nuspec does not depend on the Attributes package"; exit 1; }
          for tfm in netstandard2.0 netstandard2.1 net8.0 net9.0; do
            unzip -Z1 "$attrs" | grep -q "^lib/$tfm/Parquet\.SourceGenerator\.Attributes\.dll$" \
              || { echo "FAIL: attributes package missing lib/$tfm"; exit 1; }
          done
          echo "Package layout OK for $version."

      - name: Verify Package Consumption (v6 & Legacy packages on .NET 8 & .NET 9)
        run: |
          set -euo pipefail
          version="${{ needs.prepare.outputs.version }}"
          echo "Consuming Parquet.SourceGenerator $version and Legacy from local feed"
          dotnet run --project test/PackageConsumption/PackageConsumption.csproj \
            --framework net8.0 \
            --configuration Release \
            -p:GeneratorPackageVersion="$version" \
            -p:RestorePackagesPath="$RUNNER_TEMP/consumption-packages-net8"

          dotnet run --project test/PackageConsumption/PackageConsumption.csproj \
            --framework net9.0 \
            --configuration Release \
            -p:GeneratorPackageVersion="$version" \
            -p:RestorePackagesPath="$RUNNER_TEMP/consumption-packages-net9"

          dotnet run --project test/PackageConsumptionLegacy/PackageConsumptionLegacy.csproj \
            --framework net8.0 \
            --configuration Release \
            -p:GeneratorPackageVersion="$version" \
            -p:RestorePackagesPath="$RUNNER_TEMP/consumption-packages-legacy-net8"

          dotnet run --project test/PackageConsumptionLegacy/PackageConsumptionLegacy.csproj \
            --framework net9.0 \
            --configuration Release \
            -p:GeneratorPackageVersion="$version" \
            -p:RestorePackagesPath="$RUNNER_TEMP/consumption-packages-legacy-net9"

      - name: Verify Legacy Package Consumption Compiles on .NET Framework 4.7.2
        run: |
          set -euo pipefail
          version="${{ needs.prepare.outputs.version }}"
          dotnet build test/PackageConsumptionLegacy/PackageConsumptionLegacy.csproj \
            --framework net472 \
            --configuration Release \
            -p:GeneratorPackageVersion="$version" \
            -p:RestorePackagesPath="$RUNNER_TEMP/consumption-packages-legacy-net472"

      - name: Upload Packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nuget-packages
          path: ./artifacts/*.nupkg
          if-no-files-found: error

  publish:
    name: Publish packages
    needs: [prepare, build]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    # The release environment gives deployment history and a scoped-secrets namespace. It is
    # not an approval gate: required reviewers are org-only, and GitHub forbids self-approval —
    # solo, nothing can pause this job. The brake is the manual dispatch plus the build job.
    environment: release
    steps:
      - name: Download Packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nuget-packages
          path: ./artifacts

      - name: Download Release Notes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-info
          path: ./release-info

      - name: Login to NuGet via OIDC (Trusted Publishing)
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER || 'rtk_13' }}

      - name: Push to NuGet
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push ./artifacts/*.nupkg \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate \
            --no-symbols

      # Prereleases land on NuGet.org only; the public GitHub release is reserved for
      # full versions, so the releases page stays a list of things people should adopt.
      - name: Create GitHub Release
        if: ${{ needs.prepare.outputs.is_prerelease == 'false' }}
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: ${{ needs.prepare.outputs.version }}
          target_commitish: ${{ github.sha }}
          body_path: ./release-info/release-notes.md
          files: ./artifacts/*.nupkg
