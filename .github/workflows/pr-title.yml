name: PR Conventional Title Check

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened
  merge_group:

permissions:
  contents: read
  pull-requests: read

jobs:
  # Short, stable identifier — see the note in ci.yml. This is the name branch protection matches.
  pr-title:
    name: pr-title
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR Title Format
        if: github.event_name != 'merge_group'
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            docs
            style
            refactor
            test
            chore
            ci
            build
          requireScope: false

      - name: Pass trivially in merge queue
        if: github.event_name == 'merge_group'
        run: echo "Merge group execution; PR title was validated during PR review."
