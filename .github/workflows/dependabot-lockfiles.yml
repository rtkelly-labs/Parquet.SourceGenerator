name: Dependabot Lock Files

# Regenerates every packages.lock.json on a Dependabot NuGet pull request and pushes the result back
# to the pull request's branch, so the locked restore in ci.yml passes. It does not loosen anything:
# CI still restores with --locked-mode, and this job proves the regenerated files pass it before it
# pushes them.
#
# Why it exists: Dependabot's NuGet updater rewrites the lock files itself, and gets the one
# multi-targeted project wrong. On #696, #698, #699, #700 and #705 it kept only the netstandard2.0
# section of src/Parquet.SourceGenerator.Attributes/packages.lock.json and deleted netstandard2.1,
# net8.0 and net9.0, so `dotnet restore --locked-mode` failed with NU1004 in `test`, `derived` and
# hence `build`. Restoring with the repository's own SDKs writes all four sections. (NuGet's NU1004
# text names the two sides the wrong way round: "Lock file target frameworks" lists the project's.)
#
# Trust: `pull_request`, not `pull_request_target`, so the workflow file and the code come from the
# pull request itself, and the job runs only for a pull request Dependabot opened on a branch of this
# repository and only when Dependabot made the push. Dependabot-triggered runs see Dependabot
# secrets only, so WORKFLOW_PR_TOKEN must exist as a Dependabot secret (docs/internals/
# ci-gate-matrix.md, R11). The work is split across two jobs on two runners:
#   lock-files  restores (which runs MSBuild targets from the updated packages), proves the result in
#               locked mode, and uploads ONLY the changed lock files as an artifact. No secret.
#   push        on a fresh runner that never ran dotnet or project code, checks the artifact holds
#               nothing but existing packages.lock.json paths with valid JSON, then commits with git
#               hooks disabled and pushes with the token. A compromised package can therefore not
#               leave anything behind (a git hook, a patched tool) that later runs beside the token.
#
# Why a token and not GITHUB_TOKEN: a push made with GITHUB_TOKEN starts no workflows (#568), so the
# pull request would keep its red checks. The push with WORKFLOW_PR_TOKEN starts CI; its own
# `synchronize` event has a different actor, so this job skips it and cannot loop.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lock-files:
    name: lock-files
    if: >-
      github.actor == 'dependabot[bot]'
      && github.event.pull_request.user.login == 'dependabot[bot]'
      && github.event.pull_request.head.repo.full_name == github.repository
      && startsWith(github.event.pull_request.head.ref, 'dependabot/nuget/')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - name: Checkout the pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The head commit, not the merge commit: the fix is committed on top of it and pushed to the
          # same branch.
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      # The SDKs ci.yml restores with; global.json rolls forward to the newest.
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Regenerate the lock files
        run: |
          set -euo pipefail
          dotnet restore Parquet.SourceGenerator.slnx --force-evaluate

      # The same restore ci.yml runs. If the regenerated files do not pass it, nothing is pushed.
      - name: Verify the lock files in locked mode
        run: dotnet restore Parquet.SourceGenerator.slnx --locked-mode

      - name: Check that only lock files changed
        id: diff
        run: |
          set -euo pipefail
          changed=$(git status --porcelain --untracked-files=all)
          if [ -z "$changed" ]; then
            echo "The lock files Dependabot wrote already match a restore; nothing to push."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s\n' "$changed"
          others=$(printf '%s\n' "$changed" | cut -c4- | grep -v -E '(^|/)packages\.lock\.json$' || true)
          if [ -n "$others" ]; then
            echo "::error::The restore changed files other than packages.lock.json; refusing to push:"
            printf '%s\n' "$others"
            exit 1
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Only the changed lock files leave this runner; the push job validates them again.
      - name: Stage the changed lock files
        if: steps.diff.outputs.changed == 'true'
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/lock-files"
          mkdir -p "$stage"
          git status --porcelain --untracked-files=all | cut -c4- | while IFS= read -r f; do
            mkdir -p "$stage/$(dirname "$f")"
            cp -- "$f" "$stage/$f"
          done

      - name: Upload the changed lock files
        if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lock-files
          path: ${{ runner.temp }}/lock-files/
          if-no-files-found: error
          retention-days: 1

  push:
    name: push
    needs: lock-files
    if: needs.lock-files.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout the pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Download the changed lock files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lock-files
          path: ${{ runner.temp }}/lock-files

      # The artifact came from a runner that executed package code, so it is data to check, not
      # trust: regular files only, each an existing tracked packages.lock.json, each valid JSON.
      - name: Validate and apply the lock files
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/lock-files"
          if find "$stage" -mindepth 1 ! -type f ! -type d | grep -q .; then
            echo "::error::The artifact contains something other than regular files; refusing to push."
            exit 1
          fi
          count=0
          while IFS= read -r -d '' file; do
            rel="${file#"$stage"/}"
            case "$rel" in
              packages.lock.json|*/packages.lock.json) ;;
              *) echo "::error::Unexpected file in the artifact: $rel"; exit 1 ;;
            esac
            if ! git ls-files --error-unmatch -- "$rel" > /dev/null 2>&1; then
              echo "::error::$rel is not a tracked lock file on this branch; refusing to push."
              exit 1
            fi
            python3 -c 'import json, sys; json.load(open(sys.argv[1]))' "$file"
            cp -- "$file" "$rel"
            count=$((count + 1))
          done < <(find "$stage" -type f -print0)
          if [ "$count" -eq 0 ]; then
            echo "::error::The artifact held no lock files."
            exit 1
          fi
          echo "Applied $count lock file(s)."

      - name: Push the regenerated lock files
        env:
          PR_TOKEN: ${{ secrets.WORKFLOW_PR_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          if [ -z "${PR_TOKEN:-}" ]; then
            msg="WORKFLOW_PR_TOKEN is not available to Dependabot runs, so the regenerated lock files were not pushed and the locked restore in CI will fail with NU1004. Add the token as a Dependabot secret (Settings, Secrets and variables, Dependabot), see docs/internals/ci-gate-matrix.md (R11), or run 'dotnet restore Parquet.SourceGenerator.slnx --force-evaluate' on the branch and push the lock files."
            echo "::error title=Lock files not pushed::$msg"
            echo "$msg" >> "$GITHUB_STEP_SUMMARY"
            git diff --stat >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # No repository hook may run beside the token.
          git config core.hooksPath /dev/null
          git add -- ':(glob)**/packages.lock.json'
          git commit --no-verify -m "build(deps): regenerate NuGet lock files" \
            -m "Dependabot's lock files fail 'dotnet restore --locked-mode' (NU1004). Regenerated with 'dotnet restore Parquet.SourceGenerator.slnx --force-evaluate' by the dependabot-lockfiles workflow."
          git remote add pr-bot "https://x-access-token:${PR_TOKEN}@github.com/${REPO}.git"
          # Not forced: if Dependabot moved the branch meanwhile, the push fails and its new push
          # runs this job again.
          git push pr-bot "HEAD:refs/heads/${HEAD_REF}"
          {
            echo "Pushed regenerated lock files to \`${HEAD_REF}\`:"
            echo
            git show --stat --format= HEAD | sed 's/^/    /'
          } >> "$GITHUB_STEP_SUMMARY"
