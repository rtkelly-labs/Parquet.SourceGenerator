name: 🐛 Bug Report
description: Create a report to help us improve Parquet.SourceGenerator
title: "[Bug]: "
labels: ["type: bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to fill out this bug report!
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe the bug concisely.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal Reproduction Code
      description: Provide a minimal C# code snippet decorated with [ParquetSerializable] that reproduces the issue.
      render: csharp
    validations:
      required: true
  - type: input
    id: dotnet-version
    attributes:
      label: .NET SDK Version
      description: e.g., .NET 8.0.416 / .NET 9.0.100
      placeholder: e.g. .NET 8.0.416
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - macOS
        - Linux (Ubuntu / Debian)
        - Windows 11 / 10
        - Other
    validations:
      required: true
  - type: dropdown
    id: aot
    attributes:
      label: Is Native AOT enabled?
      options:
        - "No (JIT)"
        - "Yes (PublishAot=true)"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Log Output
      description: Please copy and paste any relevant terminal output, stack traces, or compiler diagnostics.
      render: shell
